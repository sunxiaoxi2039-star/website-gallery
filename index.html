    china: "",
    prompt: "# 一次性生成这件作品的 Prompt\n\n> 请做一个可静态托管的网页作品《深渊：活的深海》（ABYSSAL: The Living Deep 的致敬重制）。它是一片可以连续探索的程序化海洋：从海面随浪漂浮的镜头出发，一路潜到 1400 米，全部由同一颗种子生成，界面全部使用中文。\n\n## 技术约束\n\n- 只用 three.js（把 `three.module.js` 与 `three.core.js` 放进 `vendor/`，用 importmap 引入），ES Module、无构建步骤、只用相对路径、不依赖任何 CDN。\n- 不使用任何贴图、模型、字体或音频文件；地形、珊瑚、动物、天空与声音全部由代码生成。\n- 所有材质用自写 GLSL 的 `ShaderMaterial`，并共享同一段“水下光学”GLSL，保证任何深度下风格一致。\n- 需要 WebGL2；不支持时给出中文提示。页面必须在 390px 宽的手机上不横向溢出。\n\n## 页面框架\n\n- 顶部一条细顶栏：左 `← 三方对照`（链接 `../../compare/index.html`），中间“深渊：活的深海” + 小标签「Opus 5.5 · 独立逆向」，右 `原作 @emollick ↗`（链接 https://x.com/emollick/status/2095673885605630429）。`?shot=1` 时隐藏顶栏，`?ui=0` 时隐藏界面。\n- 画布下方叠一层 HUD（风格：深色半透明方块按钮、米白墨色、大号衬线标题、等宽小字标签、淡绿色主按钮）：\n  - 左上 “ABYSSAL / 活的深海”；右上：上浮、下潜、探索（海图）、世界实验室、?。\n  - 右侧深度计：大号数字 + “水面以下/以上”，下方一条可点击的深度刻度 0 水面 / 200 暮光带 / 600 下暮光带 / 1,000 午夜带 / ≈1,400 热液区，并有随深度移动的标记。\n  - 左下标题区：随所处区域淡入切换的大标题与副标题（呼吸之海、珊瑚大教堂、沉没的森林、深入蔚蓝、暮光带、漫长的暮光、午夜之水、午夜花园、玄武岩平原），一行“附近 · 物种 · 物种…”；在海面时显示“潜入珊瑚礁”按钮。\n  - 底部四个生境标签（珊瑚礁 / 海藻林 / 开阔大洋 / 深渊，快捷键 1–4），当前区域有下划线。\n  - 右下工具栏：漂流、游动、暂停、潜水灯、观察、图鉴、截图（不含界面的 PNG），下方一行提示。\n  - 旅程进行中在顶部显示“正在前往 · X”进度条与“停在这里”。\n\n## 世界生成（同一片海）\n\n- 种子（数字或文字，文字哈希成稳定整数；默认 713）→ 在 4.8 km 见方范围内烘焙 768² 的 RG32F 高度图（高度 + 细节幅度）与 RGBA 生境图，再加一张 256² 可平铺细节噪声。GPU 顶点着色器用 `texelFetch` 手写双线性采样；CPU 用完全相同的公式采样，用于碰撞、动物贴地与路线规划。\n- 布局：北侧陆架（-15 到 -30 米）；西侧是沿东北向延伸的珊瑚脊与沙质水道，东侧是岩质海藻林与林间空地；陆架边缘突然坠入陆坡，一条蜿蜒峡谷从陆架切到深渊；南侧是约 -1400 米起伏的深渊平原，散布着热液带。可航行半径 2.2 km。\n- 四个站点（reef / kelp / blue / deep）与 11 个目的地（reef-ridges、reef-channels、reef-gardens、kelp-avenues、kelp-clearings、kelp-outer、shelf-edge、canyon-wall、vent-belt、basalt-plain、far-vents）都只是这片海里的坐标。\n- 镜头周围的地形用一张以镜头为中心、近密远疏的网格（近处约 0.75 米一格）实时采样高度图，并在片元里加沙纹、岩面凹凸、藻皮与生境着色。\n\n## 光与水\n\n- 三通道的下行衰减 Kd、视线衰减 Kv、散射系数 b；沿视线的内散射用解析积分（起点深度、方向、长度），水下穹顶就是 L→∞ 的积分。清澈度、上升流（更绿）、离岸（更清）、沉积物都只改这三组系数。\n- 焦散：两层随时间漂移的“绝对值噪声网”，沿折射后的太阳方向投影，随深度变弱变糊。\n- 沿折射太阳方向的 2048² 正交阴影图，只覆盖镜头前方约 64 米。\n- 自动曝光；潜水相机式部分白平衡（浅处按阳光路径、深处按潜水灯往返路径补偿红光）。\n- 两盏潜水灯（自动随深度亮起，可手动覆盖）。生物发光的强度按 1/曝光 缩放。\n- 后期：半分辨率体积光（阳光光柱 + 灯光光束）、两级泛光、ACES、暗角与细颗粒。镜头靠近水线时把场景渲两遍，逐像素用 GLSL 里的浪高判断水上/水下，做出随浪移动的分屏与暗色水膜线。\n\n## 海面与天空\n\n- 12 个 Gerstner 波（由风速估算峰值波长与波高，加上涌浪），CPU 与 GPU 同参数；漂浮镜头用 CPU 迭代反解真实浪高并随浪倾斜。海面从空中看：天空反射 + 太阳高光 + 浪峰次表面散射 + 雅可比泡沫；从水下看：斯涅尔窗与全反射。事件波：海底震颤的环形波列、畸形浪波包。\n- 天空：解析大气渐变 + 在云层薄壳里 14 步步进的积云（阈值随高度升高形成圆顶，朝太阳采样做自阴影与银边）+ 夜空的星、月与银河带；雨线与分叉闪电。夜里上升流喂养的表层藻华在浪峰被扰动时发出青绿色光。\n\n## 景物（程序化 + 实例化）\n\n- 分层石灰岩台地（顶上长珊瑚）、巨石、陆坡石柱、玄武岩、鹿角珊瑚、脑珊瑚、桌状珊瑚、海扇、海鞭、管状与桶状海绵、巨藻（高度随水深与“海藻高度”旋钮，顶点着色器弯曲并随波浪涌动）、海草丛、冷水珊瑚、矿物烟囱（顶上升起羽流粒子）与管虫丛。\n- 以 32 米地块、世界坐标为种子播种；只展开镜头附近的地块，逐帧做视锥与距离剔除；回到同一地点群落不变。\n\n## 动物（约 30 个物种群体）\n\n- 珊瑚礁：蝴蝶鱼、鹦嘴鱼、雀鲷、礁鲨、蝠鲼、章鱼、螃蟹、海星、海胆；海藻林：海豹、银色鱼群、海龟；蔚蓝：座头鲸、海豚、金枪鱼、翻车鱼、鱿鱼；200–1000 米：灯笼鱼、斧头鱼、中层水虾、吸血鬼乌贼、龙鱼；1000 米以下：鮟鱇、宽咽鱼、烟灰蛸；深海底：大王具足虫、蛇尾、海参、海鳃、热泉虾；漂流者：水母、管水母。\n- 每个物种一套程序化解剖（放样躯干、尾鳍/背鳍/臀鳍/胸鳍、腕足、眼睛、发光器官），顶点属性记录脊柱坐标、拍动权重、腕编号、发光与收缩，通用顶点着色器做身体波动、鳍的拍动、腕的卷曲、步足交替与伞体收缩。\n- 30Hz 固定步长 + 插值渲染：鱼群分离/对齐/聚合，前瞻避地形与大石，被掠食者或正在游动的潜水员惊散后重聚；礁鱼游到岩面低头啄食；掠食者偶尔追向附近的猎物群；海豚、海豹、海龟、座头鲸周期性上浮换气；底栖动物走一段停一段、螃蟹横行；鱿鱼喷水后退；水母脉动漂流；热泉虾围着烟囱打转；转弯时侧倾。暂停时位置与附肢一起冻结；漂流模式下镜头不惊扰动物。\n- 群落按镜头周围的生境适宜度加载与回收，初次生成多放在镜头前方；深处群落半径收拢到潜水灯范围。实验室里显示的是当前加载的数量。\n\n## 交互\n\n- 漂流 / 游动（WASD 沿视线游动、拖动环顾、Q/E 下沉上升、Shift 加速、滚轮缩放）；上浮、沿峡谷下潜（已在深水区则直接下沉）、深度站点、1–4 生境旅程、海图目的地或海图任意一点；旅程沿地形平滑并可“停在这里”。\n- 世界实验室四个页签：世界（种子、新种子、地形起伏、生物覆盖、海藻高度、生境尺度、重置配方、复制世界链接）、生命（动物丰度、掠食者、底栖生物、水母与漂流者、鱼群规模、当前加载数量）、水体（清澈度、洋流、生物发光、深层上升流、潜水灯 自动/开/关、海洋声音与音量）、天气（白天/黄昏/风暴/夜晚、太阳高度、云量、风速、涌浪、风暴强度，展开更多：风向、涌浪周期、浪尖陡度、降雨、雾霾、云密度；事件：海底震颤、畸形浪、闪电）；底部“视图与控制”：在水线漂浮、画质、帧率、操作说明。地形类旋钮松开时重建，天气与水体旋钮拖动时实时生效。\n- 观察（O）：选中视野里看得清的动物，屏幕上用四角括号跟随，卡片显示名称、描述、距离与深度，可“跟随”（镜头缓缓移到舒适距离）、“下一个”；点画面上的动物也能选中。\n- 野外图鉴（J）：动物需要在画面里停留约 1 秒、距离足够近、没被地形挡住、并且被阳光/潜水灯/自身发光照亮才记录；记录首次深度与种子，存在 localStorage（读写包 try/catch）。\n- 海洋声音（M，默认关闭）：WebAudio 实时合成浪涌、水下低鸣、礁区噼啪、远处的鲸歌、热泉嘶声与震颤低频。\n- 快捷键：G 实验室、R 新种子、C 海图、L 潜水灯、P 暂停、H 隐藏界面、F 漂流/游动、Esc 关闭。\n- URL 参数：`site`、`place`、`seed`、`light`（day/dusk/storm/night）、`surface`（1 / waterline）、`depth`（200/600/1000/vent）、`relief`、`cover`、`height`、`habitatScale`、`life`、`predators`、`benthos`、`jellies`、`shoal`、`clarity`、`current`、`glow`、`upwelling`、`lamp`、`preset`、`adaptive=0`。\n- 自适应内部分辨率保帧率；手机默认低画质（关闭阴影）。\n\n## 交付\n\n`index.html`、`css/`、`js/`（按模块拆分：noise、world、optics、sky、surface、terrain、post、geom、scenery、fauna-geo、species、fauna、particles、explore、sound、ui、main）、`vendor/`。完成后用无头浏览器在海面、珊瑚礁、海藻林、蔚蓝、600 米、热液花园、夜晚、风暴、水线与 390px 手机视口逐一截图检查，确认没有控制台报错。",

    prompt: "# 一次性生成 Prompt\n\n> 你是一名兼做 GIS 数据工程与实时图形的前端工程师。请做一个名为 **「首尔 3D 地图集」** 的网页：一块可以旋转、缩放的首尔微缩沙盘。数据要真实，观感要像桌面模型，还要带地标飞越导览和连续的昼夜光照。交付物是一个无需构建、可直接静态托管的目录。\n\n## 一、交付与约束\n- 目录结构：`index.html`、`css/style.css`、`js/{main,geo,landmarks}.js`、`data/*`、`vendor/three/*`。\n- 只用相对路径，禁止 CDN。three.js r170 通过 `npm pack three@0.170.0` 拿到，拷入 `vendor/three/`（`three.module.min.js`，以及 addons 里的 OrbitControls、EffectComposer、RenderPass、ShaderPass、UnrealBloomPass、OutputPass 及其依赖），用 importmap 映射 `three` 和 `three/addons/`。\n- 界面全部用中文，地名附韩文。页面顶部有一条 36px 的细顶栏：左边 `← 三方对照`，中间作品名加小标签，右边链接原作。\n- 手机 390px 宽时不能横向溢出，面板改为底部抽屉。\n\n## 二、离线数据管线（Python：pyarrow、shapely、numpy、Pillow、scipy）\n1. **范围与投影**：以首尔市厅（126.978E, 37.5665N）为原点做等距投影，1 单位 = 1 km，x 向东、z 向南。沙盘范围 x∈[-21.8, 21.8]、z∈[-18.6, 18.9]。\n2. **取数**：从 Overture Maps 在 S3 上的 GeoParquet（`overturemaps-us-west-2/release/<最新>/theme=*/type=*`）读取。先读每个文件的 footer，按 row group 的 bbox 统计筛选，再用 HTTP Range 只拉相交的 row group。需要的图层：buildings/building、transportation/segment（含 road_flags 里的 is_bridge / is_tunnel 区间）、base/water、base/land_use、base/land_cover、base/land、divisions/division_area（取首尔 25 个 county）。\n3. **地形**：AWS Terrain Tiles 的 Terrarium z12 瓦片，重采样成 728×626 的网格（int16，单位 0.1 m）。在水域掩码内把地形压到水位（3 m）以下，陆地不低于 5.5 m；大面积的汉江压平，支流按邻域最低点下挖。\n4. **建筑**：丢弃面积小于 60 ㎡ 和地下建筑，以及落在水里、地标保留区内的建筑。取最小外接旋转矩形，按面积比例缩小。高度优先用 height，其次用 num_floors×3.3+2；都缺失时按规则估算：住宅用地内、长宽比 ≥1.9、短边 9–24 m 的板楼判为公寓，高 36–70 m；小房子 5–9 m；商业大体量 18–42 m；学校和工厂压低。类型编码为：独栋、中层、公寓、玻璃塔、工业、公共、韩屋（宫阙周边）；最高位标记“首尔市界外”。每栋存 14 字节：x、z 各 uint16 量化，宽、深、高、基底高程各 uint16（单位 0.1 m），角度 uint8，类型 uint8。整体按体量降序排列。\n5. **烘焙纹理（4096×3524）**：\n   - `ground.jpg`：土地覆盖与用地配色，市界外降低饱和度；次级道路与铁路画成细线；全部建筑足迹画成屋顶色块并加一圈模糊接触阴影；水面填河床色。\n   - `night.jpg`：道路按等级画成暖橙色光线，叠加模糊泛光，再按建筑密度加辉光；市界外调暗，水面为黑。\n   - `water.png`（水域掩码，轻微模糊）；`mask.png`（R 为水、G 为绿地、B 为首尔市界内）。\n6. **meta.json**：主干道（高速、快速路、主干、次干）每 40 m 加密一次的折线，每个点带标记（0 普通、1 桥、2 隧道），并按沙盘范围裁剪；25 个区的多边形（简化到 25 m），附代表点与面积；首尔市界。\n7. **trees.bin**：在森林、公园、墓地、高尔夫等掩码内按概率撒 7 万棵树，每棵存 x、z、尺寸、类型。\n\n## 三、渲染\n- **地形**：索引网格，法线用中心差分计算。使用 MeshStandardMaterial，通过 `onBeforeCompile` 注入以下内容：\n  - 用 `water.png` 在像素级判定水面：水色随时间变化，粗糙度 0.16，法线加上三组正弦波纹（按 `fwidth` 在远处淡出），菲涅尔项反射天空色；\n  - 夜间自发光为 `pow(night.jpg, 2.3) × 夜色系数 × 随相机距离衰减的系数`；水面用 mip 偏置 5 采样灯光图，作为模糊倒影；\n  - 季节色乘在绿地掩码上；下雪时铺白，下雨时整体变暗、粗糙度降低。\n- **沙盘**：四边侧壁采样地形边缘，贴土层条纹纹理；底部是深色木质底座、黄铜饰条，南面有一块铭牌。\n- **建筑**：12×10 个区块，每块一个 InstancedMesh（去掉底面的单位盒，底边在 y=0），实例属性 `aInfo = (宽, 夸张后高度, 深, 类型)`。每块内部按 `max(宽, 深, 高×1.6)` 降序排序；每帧算出最小可见尺寸 `1.3px × 距离 / 焦距`，二分查找后设置 `mesh.count`。片元着色器：\n  - 按类型和哈希取墙色与屋顶色，屋顶约 40% 刷绿色防水漆；\n  - 按层高 × 窗宽划分窗格，并用 `fwidth` 抗锯齿；窗格小于像素时过渡到平均值；\n  - 墙体底部做 AO 压暗；\n  - 夜间窗格按哈希和亮灯率点亮，暖色与冷白色混合；远处降到 25% 并统一为暖色；玻璃塔顶部加灯带。\n- **桥梁**：只为桥段生成几何体。桥面高度取两端引桥高度插值、加一点拱度，并保证离水面有净空；侧面带夜间灯带；跨水段每 3 个点放一个桥墩。\n- **车流**：14,000 个 Points 沿主干道折线靠右行驶，时间做了缩放。白天为各色车身，夜间正向为白色车头灯、反向为红色尾灯（HDR 值，参与 Bloom）。\n- **天空**：天球着色器，按太阳高度角在 7 个关键帧之间插值；包含太阳盘与光晕、地平线辉光、星空（哈希加闪烁）和月亮。\n- **光照**：太阳方向用首尔纬度与赤纬的公式计算；太阳高度低于 -2° 时主光切换为月光。阴影相机每帧跟随视点，半径 = 相机距离 × 0.75，并按纹素对齐。\n- **后期**：HalfFloat + 4×MSAA 的 RenderTarget → UnrealBloom（夜间增强）→ 两遍可分离的移轴模糊（强度随俯仰角变化）→ 暗角与饱和度 → OutputPass（ACES）。\n- **自适应画质**：帧率低于 28 时降低像素比、提高 LOD 阈值，高于 55 时回升。\n\n## 四、地标（22 处，程序化建模，给出真实经纬度）\n北汉山白云台、景福宫、昌德宫、光化门广场、清溪川、崇礼门、首尔站、N 首尔塔、兴仁之门、DDP、首尔林、乐天世界塔、乐天世界魔幻岛（石村湖岛上）、奥林匹克公园和平之门、蚕室奥林匹克主体育场、COEX、江南站、盘浦大桥月光彩虹喷泉、龙山、汝矣岛 63 大厦、首尔世界杯体育场、金浦机场。\n\n建模要点：\n- 乐天世界塔：超椭圆截面锥形放样，顶部是开放钢构冠顶。\n- N 首尔塔：落在南山山顶，塔身夜间循环变色。\n- 63 大厦：金色梯形挤出。\n- DDP：曲线轮廓挤出并大倒角，表面有 LED 点阵。\n- 城门：石台加拱门，上面是重檐门楼；兴仁之门另加半圆瓮城。\n- 景福宫：宫墙、光化门、兴礼门、勤政殿（重檐加回廊）、思政殿等殿阁、庆会楼与池、香远亭、若干院落。韩式屋顶用 10 个三角面拼出四角起翘。\n- 两座体育场用 Lathe 旋转体。\n- 喷泉：只在桥体跨水段沿两侧布置喷嘴，GPU 粒子做抛物线，夜间呈彩虹色，叠加混合。\n- 金浦：3 架飞机沿 136° 跑道方向循环进近和起飞，夜间有航行灯。\n- 超高层楼顶有闪烁的红色航空障碍灯。\n\n每个地标配一张卡片：中文名、韩文与英文名、一段说明、三项数据、坐标，以及巡游镜头参数（距离、俯角、方位）。\n\n## 五、交互与 UI\n- **OrbitControls**：拖动旋转，右键或双指平移，滚轮缩放并朝向光标，俯角上限 82°。键盘支持方向键平移、+/- 缩放、H 回全景、T 开始巡游、N 切换昼夜。\n- **飞行**：目标点、方位、俯角做插值；距离在对数空间插值，中途按行程抬高形成弧线；缓动用三次 ease。\n- **巡游**：依次飞过 22 站，每站停留 7.5 秒并缓慢环绕，同步更新卡片和进度条；任何手动操作都会暂停巡游。\n- **标签**：地标标签为编号胶囊、引线和圆点，可点击；区名、山峰、桥梁、河流标签按距离淡入淡出；地标标签按优先级做屏幕空间碰撞避让。\n- **面板**：左侧是品牌、统计和地标列表；右侧是时间（滑杆、流动按钮、清晨/正午/黄昏/夜晚预设）、季节、天气和图层开关（区界、地名、车流、树木、建筑、移轴）；左下是可点击的小地图，显示视锥投影、当前区名和坐标；底部 dock 有全景、巡游、指北。\n- **区域**：鼠标悬停时显示区名、面积和海拔（通过高度场步进拾取），区界光幕随之升高；点击区域飞过去。\n- **载入**：载入页显示进度条；开场从高空俯冲到全景。默认时间 17:15，季节为秋。\n- **视觉风格**：深色半透明磨砂面板，金橙色主色（#f2b35e），青色辅色（#74c7cf），不使用网络字体。",

    prompt: "# 一次性生成本作品的 Prompt\n\n> 你是一名图形程序员兼美术指导。请用 Three.js（r18x，ES Module + importmap，本地 `vendor/three/three.module.js` 和 `three.core.js`，不用 CDN，不用构建工具）做一个单页网页作品：**《走进梵高的小镇》**，把梵高的六幅画重新想象成一座可以第一人称步行穿越、处处都像油画笔触的 3D 小镇。界面文字全部用中文。\n>\n> ## 一、六幅画与小镇地理（必须是一座连通的镇，不是六个展厅）\n> 使用坐标 x 向东、z 向南、y 向上，单位米。\n> 1. **夜间露天咖啡座**（1888）：镇中心一条南北向的石板主街。西侧是咖啡馆：黄色墙面，一楼灯火通明，外挑一个向下倾斜的巨大黄色雨篷，雨篷下是橙黄色露台、圆桌和椅子，墙上挂一盏带巨大光晕的灯。东侧是蓝紫色的夜间楼房，窗子亮着灯。街道尽头是一座尖塔教堂。\n> 2. **黄房子（街道）**（1888）：东北方向的拉马丁广场。广场是沙土地面；黄房子是两层的转角楼，配绿色百叶窗和门。左邻是一栋粉色餐馆，挂着条纹雨篷。右边一条街向北，从石砌铁路高架桥下穿过（高架桥一直延伸到河上）。\n> 3. **阿尔勒的卧室**（1888）：就在黄房子里面，要能从正门真正走进去。房间是梯形的（一面墙是斜的），墙面淡紫蓝，地板是带绿色笔触的红褐色，黄色木床配大红被和柠檬色枕头，两把草编椅，窗边小桌上放着蓝色水壶，蓝色门，墙上挂几幅小画、一面镜子和一条毛巾。\n> 4. **罗纳河上的星夜**（1888）：镇东的河岸。近岸是缓坡草地（带粉紫色笔触），停着两三条小船，站着一对散步的男女。对岸是一排剪影楼房，窗户亮着灯；岸边一列煤气灯，灯光在水面上拉出黄橙色的倒影柱。天上有北斗七星。\n> 5. **麦田群鸦**（1890）：镇西的麦田。从一个路口分出三条红土小路（左、中、右），路边有绿色草缘。麦子用数万根金黄和赭色的笔触精灵表现，随风摆动。天空深蓝、翻涌，有两团被拉长的白云，二三十只乌鸦在盘旋振翅。\n> 6. **星月夜**（1889）：镇西南的一座小山。山顶有一棵高约 17 米的火焰形柏树（由数千笔墨绿、橄榄、棕黑的笔触组成）。从山顶往东北能俯瞰整座小镇、教堂尖塔和远处蓝色的阿尔皮耶山；天空里有巨大的双涡旋、带同心光环的星星和一弯橙色月牙。\n> 地形：镇区平整；麦田有轻微起伏；外围一圈山把地平线封起来，西侧较低，北侧是山脉。世界边界是一个圆，河道不可涉水。所有建筑都有碰撞。镇里填充程序化生成的街区楼房（奶油、赭、鲑粉、淡蓝、淡紫墙面，红陶坡顶，彩色百叶窗，夜里约四成窗户亮灯），加上街灯、广场树和行人。\n>\n> ## 二、画风：必须像画出来的，而不是加滤镜\n> 1. **世界空间的逐像素程序化笔触**。写一个 `ShaderMaterial` 给所有静态几何用。\n>    - 按法线主轴做三平面投影，得到平面坐标，再按\"单元大小\"切成网格，每格拥有一笔。每一笔有随机偏移、长度（0.6–1.0 格半长）、宽度（长度 / 长宽比）、角度（基础角 + 抖动 + 可选噪声流场），宽度沿长度收窄，形状是圆头胶囊。\n>    - 用两层交错的网格，在 3×3 邻域里找出优先级最高的覆盖笔（最上层），同时记下第二名。\n>    - **光照在笔触中心的世界坐标上算**，所以光斑会被量化成一块块纯色的笔触。\n>    - 每一笔：颜色从 3 色调色板里按哈希选取并抖动；加上隆起高光、鬃毛纹、起笔厚收笔薄；可选深色描边（用于石板路）。笔触抗锯齿的边缘混到第二名那一笔上，不要混到深色缝隙里。\n> 2. **两级 LOD**：笔触格子在屏幕上小于约 4 像素时，淡出到 4 倍大的粗笔触层，再往远才淡出到平均色。LOD 用两个方向导数的几何平均来判断，这样掠射角的地面不会过早变平。\n> 3. **每个顶点带调色板和笔触参数**（3 个颜色、单元大小、长宽比、角度、抖动、自发光、流场、描边、尺寸）。所有建筑合并成一个网格，一次绘制。\n> 4. **夜色调**：夜间只对环境光那部分做色相推移（推向蓝、紫、绿），灯光照到的部分保持暖色。这是一幅\"没有黑色的夜景\"。灯光衰减要陡，免得街对面也被照成橙色。\n> 5. **天空**：\n>    - 先把颜色场和方向场渲染到等距柱状 RT 上（颜色 1024×512，方向 512×256；方向用倍角向量存储，才能做轴向混合）。颜色场包括渐变、横向波纹色带、多个带螺旋色带的涡旋、星星的同心光环、月牙、麦田的云；方向场是水平流加上涡旋、星星、月亮周围的切向流。\n>    - 天球着色器按纬度分行、每行的格子数随     prompt: "# 一次性生成 Prompt：轨道能量核心（Orbital Core）\n\n> 用途：让一个代码模型在一次回复里生成本作品的完整静态站点。\n\n---\n\n请用 **Three.js（r181，ES Module + importmap，本地 `vendor/` 目录，不用 CDN、不用构建工具）** 做一个单页 3D 产品展示网页，主角是一件「双环能量核心」。目标是：看起来像一件在 Blender 里精细建模、用 Cycles/Eevee 渲过的硬表面产品，而不是一个球加两个甜甜圈。界面文字全部用中文。\n\n## 文件结构\n```\nindex.html        入口（importmap: \"three\" → ./vendor/three/three.module.min.js，\"three/addons/\" → ./vendor/three/addons/）\ncss/style.css\njs/model.js       程序化建模：导出 buildOrbitalCore() → { root, parts, uniforms, materials }\njs/main.js        渲染器、环境光照、后期、相机、交互、模式状态机、UI 联动\njs/audio.js       WebAudio 合成的核心嗡鸣\nvendor/           three.module.min.js + three.core.min.js + OrbitControls / EffectComposer / RenderPass / UnrealBloomPass / OutputPass / ShaderPass 及其依赖；字体 woff2\n```\n\n## 模型（全部程序化，不加载外部模型）\n写一个 `sweepProfile(profile, {phi0, phi1, steps, closed, caps})`：把二维截面 `[(r, y)…]` 绕 Y 轴扫掠（等同 Blender 的 Spin/Screw 修改器）。**每条截面边单独生成一条带状面、拥有自己的法线**，这样倒角面会成为清晰的高光线；可选在 phi0/phi1 处用 `ShapeUtils.triangulateShape` 封端；按顶点法线自动修正三角形绕序。UV 的 u 沿圆周方向，便于做「车削金属」拉丝。\n\n1. **等离子核心**：半径 0.5 的球，ShaderMaterial，3D simplex 噪声 + 域扭曲 fbm 生成对流胞，再叠 `pow(1-|noise|, 9)` 的亮丝；深蓝→钴蓝→白热三段色，输出 HDR（>1）供辉光使用；边缘加一点日冕亮边。外面套两层 BackSide 加法混合的菲涅耳光晕球（0.86、1.35）。\n2. **测地约束笼**：`IcosahedronGeometry(0.66, 1)` 去重顶点、提取 120 条边 → InstancedMesh 细圆柱支杆 + 42 个八面体钛合金节点 + 12 个五度顶点上的小 LED。整个笼缓慢自转。\n3. **陀螺架双环（重点）**：外环 R=1.42 竖直、随万向架绕 Y 转（方位 α）；内环 R=1.16 由两根阶梯钛销挂在外环 ±X 处，绕 X 轴翻转（俯仰 β）——是真正能转的万向节，而不是两个相交的圆环。每道环：\n   - 截面是带 0.014 倒角的矩形，外表面开一条凹槽；\n   - 环体切成 12/10 段，段间留 0.03 rad 缝，每段两端封口；\n   - 凹槽里有一条连续的发光导轨，环体中心有一条「脊」发光条，**只从切缝里透出来**，所以每条缝都是一道蓝光；\n   - 在 0°/90°/180°/270° 放加厚的钛合金卡箍，上面各有三颗 LED（两冷一暖琥珀色点缀）。\n   - 万向架整体再倾斜 ~0.2 rad，并带一点缓慢进动。\n4. **悬浮基座**：一条带台阶、倒角、环形凹槽的截面扫掠成整体；凹槽内发光环；中心是菲涅耳纹发射透镜（同心阶梯 shader）；台面上叠一张 Canvas 画的刻度盘（2° 细刻度、10°/30° 长刻度、环形微缩字 `ORBITAL CORE · SPECIMEN 01 …`、4 个三角索引），加法混合，随 α 慢转；侧面 72 片散热鳍（InstancedMesh）；台阶立面 24 条状态灯缝；从透镜到核心有一束带流动条纹的加法光柱。\n5. **地台**：大圆形暗色地面 + 放射渐变的「烘焙 AO」接触阴影贴片 + 一张加法混合的地面特效 shader（基座下的光池、每 1.45 单位一圈的虚线测量环、外圈细刻度、脉冲模式下的扩散冲击波）。\n\n## 材质与光照（「Blender 质感」的关键）\n- 程序化拉丝贴图：Canvas 上画几千条沿 u 方向的随机灰线 → 作为 roughnessMap；环体与基座用 `MeshPhysicalMaterial`，`metalness 1`，环体带 clearcoat，基座开 `anisotropy`，得到车削金属那种放射状高光。\n- 自己搭一个迷你「HDRI 棚」：在一个场景里放暗色渐变天球 + 顶部大柔光箱 + 左侧冷蓝灯条 + 右侧白灯条 + 背后地平线蓝光 + 一小块暖色反光板，用 `PMREMGenerator.fromScene` 烘成 `scene.environment`。\n- 核心内放一盏投射阴影的点光源（强度随能量变化），让环、笼的影子落到基座上；再加一盏冷白主光和一盏蓝色轮廓光。\n- 背景是一个与 FogExp2 同色的天穹 shader，地面在远处无缝溶进去，不能出现地平线硬边。\n- 后期：`EffectComposer`（HalfFloat、MSAA 4x 的 render target）→ `UnrealBloomPass`（强度 ~0.45、半径 0.4、阈值 0.95，只让 HDR 发光体溢光）→ `OutputPass`（ACES）→ 自定义 ShaderPass：边缘轻微色散 + 暗角 + 胶片颗粒抖动（顺便消除暗部色带）。\n\n## 交互与状态机\n- OrbitControls：阻尼、禁平移、限制俯仰不钻到地下；距离按视口宽高比自动计算（竖屏更远），用 `camera.setViewOffset` 在桌面把模型略微推向右侧给标题让位，手机上略微下移。\n- 开场：相机从远处低角度 3.4 秒缓入，核心在 0.35–2 秒间「点火」（按真实时间计，慢设备也能播完）；用户一拖动就立刻交出控制权。双击或按 R 平滑复位。\n- 四个模式（按钮 + 键盘 1–4）：\n  - **轨道**：α、β 慢转，相机自动环绕，核心轻微呼吸；\n  - **脉冲**：转速加快，能量按「咚-哒」双峰心跳包络跳动（1.25 s 周期），每一拍地面扩散一圈冲击波、声音里出一记低频 thump；\n  - **静止**：所有转速阻尼归零，核心待机微光，状态灯变琥珀色；\n  - **拆解**：万向架回正，外环抬到上方、内环落到下方并都转平，笼子放大，核心上浮，相机目标上移；出现 5 个带引线的 HTML 标注（等离子核心 / 测地约束笼 / 外环·方位环 / 内环·俯仰环 / 悬浮基座，附尺寸规格），锚点每帧投影，环类标注自动取屏幕上最外侧的点，标注在手机上夹紧在视口内。\n- 所有速度、能量、拆解进度都用指数阻尼平滑，切换模式没有跳变。\n- 自适应分辨率：帧率低于 30 时逐步把 pixelRatio 降到 1。\n\n## UI（叠在画布上）\n- 最顶部一条 34px 细顶栏：左「← 三方对照」、中「轨道能量核心」+ 小胶囊标签、右「原作 @作者 ↗」。\n- 左上品牌「ORBITAL / OBJECTS」+ 小轨道图标；右上「样本 01 / DUAL-RING CONTAINMENT」。\n- 左侧大标题（衬线体，第二行斜体渐变字）：「两道轨道 / 一颗恒星。」+ 一段短说明。\n- 右侧实时参数表：状态、核心频率（THz）、外环方位 α、内环俯仰 β、场强输出 %，底下是一条画出能量历史的小示波器。\n- 左下四个模式按钮（带小图形符号和键位提示），页脚操作提示 + 声音开关（WebAudio：两支微失谐锯齿波过共振低通 + 次低频正弦 + 高频微光颤音，滤波截止随能量和转速变化）。\n- 背景加 76px 细网格（遮罩渐隐）和 SVG 噪点颗粒。\n- ≤740px：标题移到上方、隐藏说明段，参数表变成三列横条，四个按钮平分一行；390px 宽不能横向溢出。\n- 字体：Instrument Serif（标题）+ IBM Plex Mono（数据），woff2 放 vendor，中文回退到系统宋体/黑体。\n\n## 质量要求\n- 控制台零报错；WebGL 创建失败时显示中文提示。\n- 所有发光色用 HDR 值，靠辉光而不是把漫反射调亮来「发光」。\n- 暗部要深（钴蓝-近黑），不要整体泛白发灰。",

    desc:  "会自己弹巴赫式织体的 3D 键盘：WebAudio 合成的羽管键琴音色，按 BWV 1048 第一乐章的写法生成 G 大调乐句——右手连绵十六分音符压在行走低音上。音符条从上方落到琴键触发按键与光晕，也可以自己上手弹。",
    cover: "https://sunxiaoxi2039-star.github.io/website-showcase-sites/ideas/astra-vs-opus/assets/covers/brandenburg-piano.jpg",
    intl:  "https://sunxiaoxi2039-star.github.io/website-showcase-sites/ideas/astra-vs-opus/works/brandenburg-piano/",
    china: "",
    prompt: "写一个单文件 HTML：Three.js 画一架 E2–C6 的 3D 键盘（白键黑键、木质琴身、红色呢条），用 WebAudio 合成羽管键琴音色。\n\n音色：锯齿波 + 三角波泛音 → 带包络的低通滤波 → 快衰减振幅包络，另接一路延迟反馈当房间感；明亮度做成可调滑杆。\n\n内置乐句按巴赫《勃兰登堡协奏曲第三号》第一乐章的织体生成：八小节和声循环 G–D/F#–Em–Bm–C–G/B–Am7–D7，右手在和弦音上跑连绵的十六分音符（几套音型轮换），左手每拍一个行走低音。用前瞻调度器提前约 2.2 秒排程。\n\n视觉：琴键上方生成 Synthesia 式的音符条从高处落下，落到琴键的瞬间触发按键下沉、键面发光与一圈扩散的光晕；右上角显示当前和弦与小节数。\n\n交互：速度滑杆 52–184 BPM、延音开关、暂停；用户也能点琴键或用电脑键盘自己弹。首次进入用一个覆盖层接一次点击再启动 AudioContext。"

  {
    title: "Astra 案例集",

    desc:  "GPT-6 Astra 发布周公开作品的索引：游戏 48、网页应用 51、Blender/3D 23、视频 4、绘画 2，其中 52 件有可直接打开的 live demo。可按分类筛选与关键词搜索，每张卡片挂一条按描述反推的复刻 prompt，已临摹的 6 件一键跳到本站版本。",

    china: "",

const list = document.getElementById("list");
document.getElementById("year").textContent = new Date().getFullYear();
document.getElementById("count").textContent =
  String(EXHIBITIONS.length).padStart(2, "0") + " 个展览";

const localPreview = ["127.0.0.1", "localhost"].includes(location.hostname);
const resolveEntry = url => localPreview && url?.startsWith("https://sunxiaoxi2039-star.github.io/website-showcase-sites/")
  ? url.replace("https://sunxiaoxi2039-star.github.io/website-showcase-sites/", "../website-showcase-sites/") : url;
const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
EXHIBITIONS.forEach((entry, i) => {
  const ex = {...entry, intl: resolveEntry(entry.intl), cover: resolveEntry(entry.cover)};
  const article = document.createElement("article");
  article.className = "exhibit";
  article.innerHTML = `
    <span class="num">${String(i + 1).padStart(2, "0")}</span>
    <div class="ex-body">
      <a class="cover" href="${ex.intl}" target="_blank" rel="noreferrer" aria-label="打开${ex.title}">${ex.cover ? `<img src="${ex.cover}" alt="${ex.title}" onerror="this.remove()">` : ""}</a>
      <div>
        ${ex.prompt ? '<span class="case-badge">成功案例 · 附制作 Prompt</span>' : ''}
        <h2 class="ex-title serif"><a href="${ex.intl}" target="_blank" rel="noreferrer">${ex.title}</a></h2>
        <div class="ex-sub">${ex.sub}</div>
        <p class="ex-desc">${ex.desc}</p>
        ${ex.prompt ? `<details class="prompt-box" open>
          <summary>Prompt · ${ex.promptLabel}</summary>
          <div class="prompt-content">
            <pre class="prompt-text">${escapeHtml(ex.prompt)}</pre>
            <p class="prompt-note">${ex.promptNote || '保留发起制作时的原始需求；成品经过后续实现、调试与浏览器验证。'}</p>
            <div class="prompt-actions"><button class="copy-prompt" type="button" aria-label="复制${ex.title}的 Prompt">复制 Prompt</button>${ex.promptSource ? `<a class="prompt-source" href="${ex.promptSource}" target="_blank" rel="noreferrer">参考来源 ↗</a>` : ''}<span class="copy-status" role="status" aria-live="polite"></span></div>
          </div>
        </details>` : ''}
      </div>
    </div>
    <div class="links">
      ${ex.intl ? `<a class="gate" href="${ex.intl}" target="_blank" rel="noreferrer"><span class="tag">${ex.label ? (ex.platform || "SITES") : (localPreview && ex.intl.startsWith("../") ? "本地" : "国际")}</span>${ex.label || (localPreview && ex.intl.startsWith("../") ? "打开作品" : "GitHub Pages")} ↗</a>` : ""}
      ${ex.china ? `<a class="gate" href="${ex.china}" target="_blank" rel="noreferrer"><span class="tag">中国</span>Kimi ↗</a>` : (ex.platform === "KIMI" ? "" : `<span class="gate off"><span class="tag">中国</span>待发布</span>`)}
    </div>`;
  const copyButton = article.querySelector('.copy-prompt');
  if (copyButton) copyButton.addEventListener('click', async () => {
    const status = article.querySelector('.copy-status');
    try {
      await navigator.clipboard.writeText(ex.prompt);
      status.textContent = '已复制完整 Prompt';
      copyButton.textContent = '已复制 ✓';
      setTimeout(() => { copyButton.textContent = '复制 Prompt'; status.textContent = ''; }, 2500);
    } catch {
      const range = document.createRange();
      range.selectNodeContents(article.querySelector('.prompt-text'));
      const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
      status.textContent = '已选中全文，请按 Ctrl+C / ⌘C 复制';
    }
  });
  list.appendChild(article);
});

</script>
</body>
</html>
