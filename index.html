<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Website Gallery — 网站画廊</title>
<style>
  :root { --ink: #000; --paper: #fff; --mute: rgba(0,0,0,.45); --line: rgba(0,0,0,.14); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--paper); color: var(--ink); }
  body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
  .serif { font-family: 'Times New Roman', 'Songti SC', 'SimSun', serif; }

  .masthead { padding: 32px; display: flex; justify-content: space-between; align-items: baseline; }
  .brand { font-size: 18px; letter-spacing: .05em; }
  .count { font-size: 12px; color: var(--mute); letter-spacing: .12em; text-transform: uppercase; }

  .hero { padding: 14vh 32px 10vh; max-width: 1200px; }
  .hero h1 { font-size: clamp(40px, 7vw, 96px); font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; }
  .hero p { margin-top: 28px; font-size: 15px; line-height: 1.9; color: var(--mute); max-width: 520px; }

  .index-head { padding: 0 32px 20px; display: grid; grid-template-columns: 64px 1fr 220px; gap: 24px;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute);
    border-bottom: 1px solid var(--line); }
  @media (max-width: 720px) { .index-head { grid-template-columns: 40px 1fr; } .index-head .col-link { display: none; } }

  .exhibit { display: grid; grid-template-columns: 64px 1fr 220px; gap: 24px; padding: 40px 32px;
    border-bottom: 1px solid var(--line); align-items: start; text-decoration: none; color: inherit; }
  @media (max-width: 720px) { .exhibit { grid-template-columns: 40px 1fr; } }

  .num { font-size: 13px; color: var(--mute); padding-top: 6px; font-variant-numeric: tabular-nums; }

  .ex-body { display: grid; grid-template-columns: 168px 1fr; gap: 32px; align-items: start; }
  @media (max-width: 720px) { .ex-body { grid-template-columns: 1fr; } }

  .cover { width: 168px; height: 210px; overflow: hidden; position: relative;
    background: linear-gradient(135deg,#0b0b12 0%,#1d1033 28%,#0f3b4d 52%,#3d1030 76%,#0b0b12 100%); }
  .cover::after { content:""; position:absolute; inset:0;
    background: radial-gradient(120% 90% at 30% 20%, rgba(0,255,255,.35), transparent 55%),
                radial-gradient(100% 80% at 75% 80%, rgba(255,0,200,.3), transparent 55%); }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
    transition: transform .6s cubic-bezier(.2,.6,.2,1); }
  .exhibit:hover .cover img { transform: scale(1.05); }

  .ex-title { font-size: clamp(26px, 3vw, 40px); font-weight: 400; line-height: 1.15; letter-spacing: -0.01em; }
  .ex-sub { margin-top: 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .ex-desc { margin-top: 18px; font-size: 14px; line-height: 1.85; color: rgba(0,0,0,.72); max-width: 560px; }

  .links { display: flex; flex-direction: column; gap: 10px; }
  @media (max-width: 720px) { .links { grid-column: 2; flex-direction: row; flex-wrap: wrap; } }
  .gate { display: inline-block; font-size: 13px; letter-spacing: .04em; text-decoration: none; color: var(--ink);
    border: 1px solid var(--line); padding: 11px 18px; transition: background .2s, border-color .2s; }
  .gate:hover { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.4); }
  .gate .tag { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin-right: 8px; }
  .gate.off { color: var(--mute); pointer-events: none; border-style: dashed; }

  /* 每件作品下面挂它的生成 prompt */
  .exhibit-row { border-bottom: 1px solid var(--line); }
  .exhibit-row .exhibit { border-bottom: 0; }
  .exhibit-row:has(.pwrap) .exhibit { padding-bottom: 20px; }
  .pwrap { padding: 0 32px 34px; max-width: 1060px; }
  .pwrap details { border: 1px solid var(--line); }
  .pwrap summary { cursor: pointer; list-style: none; padding: 12px 18px;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute);
    display: flex; align-items: center; gap: 10px; }
  .pwrap summary::-webkit-details-marker { display: none; }
  .pwrap summary::before { content: "＋"; font-size: 13px; }
  .pwrap details[open] summary::before { content: "－"; }
  .pwrap details[open] summary { border-bottom: 1px solid var(--line); }
  .pwrap .pbody { position: relative; padding: 16px 18px; }
  .pwrap pre { margin: 0; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 12.5px; line-height: 1.9; color: rgba(0,0,0,.74); }
  .pwrap .copy { position: absolute; top: -34px; right: 14px; padding: 4px 12px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    font: inherit; font-size: 11px; cursor: pointer; transition: background .2s, color .2s; }
  .pwrap .copy:hover { background: var(--ink); color: var(--paper); }
  @media (max-width: 720px) { .pwrap { padding: 0 20px 26px; } }

  footer { padding: 64px 32px 40px; font-size: 12px; color: var(--mute); letter-spacing: .02em;
    display: flex; justify-content: space-between; }
</style>
</head>

const list = document.getElementById("list");
document.getElementById("year").textContent = new Date().getFullYear();
document.getElementById("count").textContent =
  String(EXHIBITIONS.length).padStart(2, "0") + " 个展览";

EXHIBITIONS.forEach((ex, i) => {
  const a = document.createElement("a");
  a.className = "exhibit";
  a.href = ex.intl || "#";
  a.target = "_blank";
  a.rel = "noreferrer";
  a.innerHTML = `
    <span class="num">${String(i + 1).padStart(2, "0")}</span>
    <div class="ex-body">
      <div class="cover">${ex.cover ? `<img src="${ex.cover}" alt="${ex.title}"
        onerror="this.remove()">` : ""}</div>
      <div>
        <h2 class="ex-title serif">${ex.title}</h2>
        <div class="ex-sub">${ex.sub}</div>
        <p class="ex-desc">${ex.desc}</p>
      </div>
    </div>
    <div class="links">
      ${ex.intl ? `<span class="gate"><span class="tag">国际</span>GitHub Pages ↗</span>` : ""}
      ${ex.china
        ? `<span class="gate" data-china="${ex.china}"><span class="tag">中国</span>Kimi ↗</span>`
        : `<span class="gate off"><span class="tag">中国</span>待发布</span>`}
    </div>`;
  // 中国入口单独跳转，避免触发整卡的国际链接
  const chinaGate = a.querySelector("[data-china]");
  if (chinaGate) chinaGate.addEventListener("click", (e) => {
    e.preventDefault(); e.stopPropagation();
    window.open(chinaGate.dataset.china, "_blank", "noreferrer");
  });

  // 一件作品 = 卡片 + （可选）生成它用的 prompt
  const row = document.createElement("div");
  row.className = "exhibit-row";
  row.appendChild(a);

  if (ex.prompt) {
    const pw = document.createElement("div");
    pw.className = "pwrap";
    pw.innerHTML = `
      <details>
        <summary>生成这件作品用的 prompt</summary>
        <div class="pbody">
          <button class="copy" type="button">复制</button>
          <pre></pre>
        </div>
      </details>`;
    pw.querySelector("pre").textContent = ex.prompt;
    pw.querySelector(".copy").addEventListener("click", (e) => {
      e.preventDefault();
      const btn = e.currentTarget;
      navigator.clipboard?.writeText(ex.prompt).then(() => {
        btn.textContent = "已复制";
        setTimeout(() => { btn.textContent = "复制"; }, 1600);
      }).catch(() => { btn.textContent = "复制失败"; });
    });
    row.appendChild(pw);
  }

  list.appendChild(row);
});
</script>
