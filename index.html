
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Website Gallery — 网站画廊</title>
<meta name="description" content="网站画廊：收藏可以亲自体验的网站，也留下制作它们的起点——每个案例附制作 Prompt，可直接阅读、复制，再打开成品对照探索。" />
<style>
  :root { --ink: #000; --paper: #fff; --mute: rgba(0,0,0,.45); --line: rgba(0,0,0,.14); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--paper); color: var(--ink); }
  body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
  .serif { font-family: 'Times New Roman', 'Songti SC', 'SimSun', serif; }

  .masthead { padding: 32px; display: flex; justify-content: space-between; align-items: baseline; }
  .brand { font-size: 18px; letter-spacing: .05em; }
  .count { font-size: 12px; color: var(--mute); letter-spacing: .12em; text-transform: uppercase; }

  .hero { padding: 14vh 32px 10vh; max-width: 1200px; }
  .hero h1 { font-size: clamp(40px, 7vw, 96px); font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; }
  .hero p { margin-top: 28px; font-size: 15px; line-height: 1.9; color: var(--mute); max-width: 520px; }

  .index-head { padding: 0 32px 20px; display: grid; grid-template-columns: 64px 1fr 220px; gap: 24px;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute);
    border-bottom: 1px solid var(--line); }
  @media (max-width: 720px) { .index-head { grid-template-columns: 40px 1fr; } .index-head .col-link { display: none; } }

  .exhibit { display: grid; grid-template-columns: 64px 1fr 220px; gap: 24px; padding: 40px 32px;
    border-bottom: 1px solid var(--line); align-items: start; text-decoration: none; color: inherit; }
  @media (max-width: 720px) { .exhibit { grid-template-columns: 40px 1fr; } }

  .num { font-size: 13px; color: var(--mute); padding-top: 6px; font-variant-numeric: tabular-nums; }

  .ex-body { display: grid; grid-template-columns: 168px 1fr; gap: 32px; align-items: start; }
  @media (max-width: 720px) { .ex-body { grid-template-columns: 1fr; } }

  .cover { width: 168px; height: 210px; overflow: hidden; position: relative;
    background: linear-gradient(135deg,#0b0b12 0%,#1d1033 28%,#0f3b4d 52%,#3d1030 76%,#0b0b12 100%); }
  .cover::after { content:""; position:absolute; inset:0;
    background: radial-gradient(120% 90% at 30% 20%, rgba(0,255,255,.35), transparent 55%),
                radial-gradient(100% 80% at 75% 80%, rgba(255,0,200,.3), transparent 55%); }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
    transition: transform .6s cubic-bezier(.2,.6,.2,1); }
  .exhibit:hover .cover img { transform: scale(1.05); }

  .ex-title { font-size: clamp(26px, 3vw, 40px); font-weight: 400; line-height: 1.15; letter-spacing: -0.01em; }
  .ex-sub { margin-top: 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .ex-desc { margin-top: 18px; font-size: 14px; line-height: 1.85; color: rgba(0,0,0,.72); max-width: 560px; }

  .links { display: flex; flex-direction: column; gap: 10px; }
  @media (max-width: 720px) { .links { grid-column: 2; flex-direction: row; flex-wrap: wrap; } }
  .gate { display: inline-block; font-size: 13px; letter-spacing: .04em; text-decoration: none; color: var(--ink);
    border: 1px solid var(--line); padding: 11px 18px; transition: background .2s, border-color .2s; }
  .gate:hover { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.4); }
  .gate .tag { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin-right: 8px; }
  .gate.off { color: var(--mute); pointer-events: none; border-style: dashed; }

  footer { padding: 64px 32px 40px; font-size: 12px; color: var(--mute); letter-spacing: .02em;
    display: flex; justify-content: space-between; }

  .ex-body > div { min-width: 0; }
  .ex-title a { color: inherit; text-decoration: none; }
  .ex-title a:hover { text-decoration: underline; text-underline-offset: 5px; }
  .case-badge { display: inline-block; margin-bottom: 13px; padding: 5px 8px; border: 1px solid #bdc8bd; color: #435d43; font-size: 10px; letter-spacing: .07em; }
  .prompt-box { margin-top: 24px; max-width: 660px; border: 1px solid var(--line); background: #f7f7f4; }
  .prompt-box summary { padding: 14px 16px; font-size: 12px; cursor: pointer; letter-spacing: .03em; }
  .prompt-content { padding: 0 16px 16px; }
  .prompt-text { max-height: 360px; overflow-y: auto; padding-right: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.9 system-ui, sans-serif; color: #303330; user-select: text; }
  .prompt-note { margin-top: 12px; font-size: 11px; line-height: 1.7; color: var(--mute); }
  .prompt-actions { margin-top: 14px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  .copy-prompt { padding: 8px 13px; font: 12px system-ui,sans-serif; border: 1px solid #b9bdb4; background: #fff; cursor: pointer; }
  .copy-prompt:hover { background: #eaede5; }
  .prompt-source { color: #435d43; font-size: 12px; text-underline-offset: 3px; }
  .copy-status { font-size: 11px; color: #435d43; }
  :focus-visible { outline: 2px solid #435d43; outline-offset: 4px; }
  @media (max-width: 720px) { .exhibit { padding: 28px 20px; gap: 12px; } .cover { width: 100%; height: 180px; } .prompt-content { padding: 0 12px 12px; } .prompt-box summary { padding: 12px; } }
  .masthead { padding-right: 92px; }
  .lang-toggle { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 50;
    min-width: 56px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(12,12,14,.72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: #fff; font: 600 13px/1 system-ui, -apple-system, "PingFang SC", sans-serif; letter-spacing: .08em; cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,.14); transition: background .2s, transform .2s; }
  .lang-toggle:hover { background: rgba(12,12,14,.88); }
  .lang-toggle:active { transform: scale(.96); }
  .prompt-lang { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 10px; }
  .prompt-lang-note { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #435d43; }
  .prompt-switch { min-height: 32px; padding: 6px 11px; font: 12px system-ui,sans-serif; border: 1px solid #b9bdb4; background: transparent; color: #303330; cursor: pointer; }
  .prompt-switch:hover { background: #eaede5; }
  html[lang=en] .ex-sub { letter-spacing: .08em; }
  @media (max-width: 720px) { .masthead { padding-right: 84px; } }
</style>
</head>
<body>

<button class="lang-toggle" id="lang-toggle" type="button" aria-label="Switch to English / 切换到中文">EN</button>

<header class="masthead">
  <div class="brand serif">Website Gallery</div>
  <div class="count" id="count"></div>
</header>

<section class="hero">
  <h1 class="serif" data-i18n="heroTitle">网站画廊</h1>
  <p data-i18n="heroText">收藏可以亲自体验的网站，也留下制作它们的起点。三个新案例附制作 Prompt，可在首页直接阅读、复制，再打开成品对照探索。</p>
</section>

<div class="index-head">
  <span data-i18n="colNum">编号</span><span data-i18n="colEx">展览</span><span class="col-link" data-i18n="colLink">入口</span>

<main id="list"></main>

<footer>

    prompt: "请从零制作一个名为「MOONLIT FORGE」的可交互 3D 微缩小屋网页。它应像一本可以触摸的童话绘本：同一座温暖的小屋，在夜晚、白天与四季之间流转。请直接交付能运行的完整网站、三维模型和可编辑源码。\n\n一、整体视觉\n采用精致的低多边形微缩模型风格，几何轮廓清楚，边缘轻微倒角，材质哑光，灯光柔和。画面安静、有大量留白；避免写实摄影、复杂后台面板和满屏装饰。模型必须为可以从不同角度观察的真实三维几何。\n\n二、小屋建模\n在 Blender 中建模并导出 GLB，同时保存 .blend；使用 Three.js 加载与渲染。以一块约 5.7×5.4 单位的厚实方形草地底座承托场景，底座有深绿色侧壁、倒角和柔和投影。\n中央是一座童话风石砌小屋：灰紫墙体、陡峭且檐角微翘的双坡屋顶、错缝排列的紫红色实体瓦片、浅灰石质屋脊和檐边。墙角露出交错石块，墙面有少量修补石。正面是琥珀色拱形木门，带纵向木板、黑色铰链、门把手和浅色拱门框；门上方有发出暖光的窄拱窗。\n左侧连接小型锻炉及高烟囱，炉口是拱形，内部可见橙暖火光；烟囱分段砌砖，顶部有缓缓漂浮的低多边形烟团。右侧是一片延伸屋檐，由细木柱支撑；屋檐下放木墩和深色铁砧，旁边堆放切口可见的木柴。门口有暖光壁灯、石阶和不规则踏步石。周围点缀岩石、小花、草丛和一棵圆润块状树冠的小树。\n把树叶、草地、发光窗、炉火、烟团和积雪分别组织成可识别的对象或材质，方便实时控制。允许合并同材质的静态细节，但保留季节变化所需部件。\n\n三、六个场景\n用底部六个标签切换 Night、Day、Spring、Summer、Autumn、Winter；默认 Night。同一模型在切换时保持当前观察角度，不重新加载。\nNight：深蓝灰背景 #191b27，奶油色正文、浅黄绿强调色，冷色环境光映衬橙色炉火、门灯与窗光。\nDay：浅灰鼠尾草绿背景 #c4caba，深绿色文字，柔和日光照亮草地与墙体，减弱炉火与窗光。\nSpring：薄荷绿背景 #a1c5b0，树冠偏粉，草地鲜绿，少量浅粉花瓣缓慢飘落。\nSummer：深青绿背景 #216060，奶油色文字，树叶浓绿、日光温暖；桌面布局将模型移到左侧，文案移到右侧。\nAutumn：灰玫瑰背景 #6c5358，暖米色文字，树叶金褐色，草地泛黄，少量金色落叶飘落，增强炉火暖意。\nWinter：蓝灰背景 #42596d，浅灰白文字，屋顶及地面可见真正的积雪几何，雪花缓缓落下，窗与炉火更暖。\n背景、文字颜色、材质颜色和灯光在约 0.8–1.3 秒内柔和过渡。烟团轻微浮动，炉火亮度小幅呼吸；特效克制，不遮挡建筑，也不让炉口成为过曝白斑。\n\n四、页面布局与文案\n桌面为铺满视口的单页，顶部左侧两行小字标志「MOONLIT / FORGE」，中间小字「ONE COTTAGE. SIX MOMENTS.」及当前章节，右侧 Pause / Play 按钮。\n主区域一般左文右图，文案约占 42%，模型约占 58%；模型视角为略俯视的三分之四视角，完整显示底座、房顶和烟囱。标题使用大号优雅衬线体，第二行斜体并使用场景强调色；小字用简洁无衬线体。\n六场景标题依次为：\nNight：Moon above. / Fire within.\nDay：Morning light. / A slower start.\nSpring：Soft petals. / Fresh starts.\nSummer：Long days. / Slow living.\nAutumn：Golden leaves. / Warmer hearts.\nWinter：Quiet snow. / Warm windows.\n每个标题下写两句简短英文氛围文案与一个进入下一场景的文字箭头按钮。右侧边缘放六个细长进度标记；底部中间是带小图标的胶囊形六场景切换器，左下「A LIVING MINIATURE」，右下「EST. 2026」。模型下方提示「DRAG TO EXPLORE」并提供重置视角按钮。\n\n五、交互\n鼠标或触摸拖动旋转小屋，带轻微阻尼并限制上下翻转。静置时缓慢自动旋转。点击场景标签、右侧进度标记、下一场景按钮，或滚动鼠标滚轮，都能切换场景；滚轮需节流，避免一次滚动跳过多章。\nPause 冻结自动旋转、烟雾、飘落粒子及炉火波动，但用户仍可拖动和切换场景；Play 恢复动画。Reset 恢复初始三分之四视角。快速连续切换时只显示当前文案，不能叠字、跳高或错位。\n\n六、移动端与工程\n手机改为上文下图，模型保持足够大，六个标签完整可点，底部控件不覆盖主要内容；390×844 视口没有横向溢出。所有按钮支持键盘焦点、可读标签；尊重减少动态效果设置。\n模型、纹理和代码使用可部署的相对资源路径，提供加载状态、加载失败提示与 WebGL 不支持提示。优先合并几何和复用材质，限制像素比与粒子数量。使用物理材质、柔和阴影、环境补光和适当色调映射呈现微缩模型质感。\n\n七、交付与验收\n交付可运行网站、GLB、Blender 源文件和启动说明。实际检查六场景、拖动旋转、暂停/继续、重置、滚动切换、快速连点与手机布局；确认模型及资源加载成功、控制台无运行错误。不要以一张渲染图、静态模型截图或空页面代替交互成品。",
    promptEn: "Please build, from scratch, an interactive 3D miniature-cottage web page called \"MOONLIT FORGE\". It should feel like a fairy-tale picture book you can touch: the same warm cottage, flowing between night, day and the four seasons. Deliver a complete, working website, the 3D model and editable source code.\n\n1. Overall look\nUse a refined low-poly miniature style: clear geometric silhouettes, slightly beveled edges, matte materials and soft lighting. The scene should feel quiet, with plenty of negative space; avoid photorealism, complex dashboard panels and wall-to-wall decoration. The model must be real 3D geometry that can be viewed from different angles.\n\n2. Modeling the cottage\nModel it in Blender and export a GLB, also keeping the .blend; load and render it with Three.js. Set the scene on a thick square grass base of about 5.7×5.4 units, with dark green side walls, bevels and a soft shadow.\nAt the center is a fairy-tale stone cottage: grey-violet walls; a steep gabled roof with slightly upturned eaves; staggered, solid plum-red roof tiles; a pale grey stone ridge and eave trim. Interlocking quoins show at the corners, with a few patched stones on the walls. The front has an amber arched wooden door with vertical planks, black hinges, a handle and a pale arched frame; above the door is a narrow arched window glowing warmly.\nOn the left, attach a small forge with a tall chimney. The forge mouth is arched, with a warm orange fire visible inside; the chimney is built of stacked brick sections, with low-poly puffs of smoke drifting slowly from the top. On the right, an extended eave rests on thin wooden posts; beneath it sit a wooden stump and a dark anvil, next to a stack of firewood with visible cut ends. By the door are a warm wall lamp, stone steps and irregular stepping stones. Scatter rocks, small flowers, tufts of grass and a small tree with a rounded, blocky canopy around the cottage.\nOrganize leaves, grass, glowing windows, forge fire, smoke puffs and snow into identifiable objects or materials so they can be controlled in real time. Static details sharing a material may be merged, but keep the parts needed for seasonal changes.\n\n3. Six scenes\nSix tabs at the bottom switch between Night, Day, Spring, Summer, Autumn and Winter; Night is the default. The same model keeps the current camera angle when switching and is not reloaded.\nNight: deep blue-grey background #191b27, cream body text, pale yellow-green accent; cool ambient light sets off the orange forge fire, door lamp and window glow.\nDay: pale grey sage background #c4caba, dark green text; soft daylight on the grass and walls, with the forge fire and window glow dimmed.\nSpring: mint background #a1c5b0, pinkish canopy, bright green grass, a few pale pink petals drifting down slowly.\nSummer: deep teal background #216060, cream text, lush green leaves and warm sunlight; on desktop the model moves to the left and the copy to the right.\nAutumn: grey-rose background #6c5358, warm beige text, golden-brown leaves, yellowing grass, a few golden leaves falling, with a warmer forge fire.\nWinter: blue-grey background #42596d, pale grey-white text, real snow geometry visible on the roof and ground, snowflakes falling gently, warmer windows and forge fire.\nBackground, text colors, material colors and lighting transition softly over about 0.8–1.3 seconds. The smoke puffs bob gently and the forge fire breathes slightly in brightness; keep effects restrained so they never obscure the building, and never let the forge mouth blow out into an overexposed white spot.\n\n4. Layout and copy\nOn desktop, a single page that fills the viewport. Top left: a two-line small logo \"MOONLIT / FORGE\"; top center: small text \"ONE COTTAGE. SIX MOMENTS.\" with the current chapter; top right: a Pause / Play button.\nThe main area is generally text on the left and image on the right, with the copy taking about 42% and the model about 58%. The model is shown from a slightly elevated three-quarter view, with the whole base, roof and chimney visible. Headlines use a large, elegant serif, with the second line in italics in the scene's accent color; small text uses a clean sans-serif.\nThe six scene headlines, in order:\nNight: Moon above. / Fire within.\nDay: Morning light. / A slower start.\nSpring: Soft petals. / Fresh starts.\nSummer: Long days. / Slow living.\nAutumn: Golden leaves. / Warmer hearts.\nWinter: Quiet snow. / Warm windows.\nUnder each headline, write two short lines of atmospheric English copy and a text-arrow button to the next scene. Place six slim progress markers along the right edge; at the bottom center, a pill-shaped six-scene switcher with small icons; bottom left \"A LIVING MINIATURE\", bottom right \"EST. 2026\". Below the model, show the hint \"DRAG TO EXPLORE\" and provide a reset-view button.\n\n5. Interaction\nDrag with mouse or touch to rotate the cottage, with light damping and limited vertical tilt. When idle, it slowly auto-rotates. Clicking a scene tab, a progress marker on the right, the next-scene button, or scrolling the mouse wheel all switch scenes; throttle the wheel so a single scroll doesn't skip several chapters.\nPause freezes auto-rotation, smoke, falling particles and forge-fire flicker, while the user can still drag and switch scenes; Play resumes the animation. Reset restores the initial three-quarter view. When switching rapidly, only the current copy is shown — no overlapping text, jumping or misalignment.\n\n6. Mobile and engineering\nOn phones, switch to text on top and model below, keeping the model large enough; all six tabs must be fully tappable, and bottom controls must not cover the main content; no horizontal overflow at a 390×844 viewport. Every button supports keyboard focus and has a readable label; respect the reduced-motion setting.\nModels, textures and code use deployable relative paths; provide a loading state, a load-failure message and a WebGL-not-supported message. Prefer merged geometry and shared materials, and cap pixel ratio and particle counts. Use physical materials, soft shadows, ambient fill light and appropriate tone mapping to convey a miniature-model feel.\n\n7. Delivery and acceptance\nDeliver the working website, the GLB, the Blender source file and startup instructions. Actually test all six scenes, drag-to-rotate, pause/resume, reset, scroll switching, rapid repeated clicks and the mobile layout; confirm that the model and assets load successfully and the console shows no runtime errors. Do not substitute a rendered image, a static model screenshot or an empty page for the interactive result.",

    prompt: "对同一批 GPT-6 Astra 原作做第二轮临摹，这次要真正「不看答案」。\n\n每件作品派一个全新上下文的子代理：只给它原作的标题、作者、原帖、demo 链接和公开的文字描述，不给第一版的代码、prompt、截图或对话记录；明确禁止它读取第一版所在的目录与 git 历史。技术栈自选，第三方库从 npm 拉进本地 vendor/，不依赖 CDN、无构建步骤。它要亲自用无头浏览器截图、看图、迭代到满意，最后交付作品、cover.jpg、NOTES.md（对原作的理解、逆向推断、技术决策、踩坑、自评、模型标识）和 PROMPT.md。\n\n再做一张三方对照页：每件作品三栏并排（Astra 原作 / 第一版 / 第二版），原作能嵌就嵌、不能嵌就给原帖原话或原作截图；「三窗同开」按钮全屏同时运行三个版本；下挂第二版的心得与 prompt；每件标出「起跑线说明」——子代理实际掌握了哪些资料、有没有隔离泄漏，让对比保持公平。",

    prompt: "# 一次性生成这件作品的 Prompt\n\n> 请做一个可静态托管的网页作品《深渊：活的深海》（ABYSSAL: The Living Deep 的致敬重制）。它是一片可以连续探索的程序化海洋：从海面随浪漂浮的镜头出发，一路潜到 1400 米，全部由同一颗种子生成，界面全部使用中文。\n\n## 技术约束\n\n- 只用 three.js（把 `three.module.js` 与 `three.core.js` 放进 `vendor/`，用 importmap 引入），ES Module、无构建步骤、只用相对路径、不依赖任何 CDN。\n- 不使用任何贴图、模型、字体或音频文件；地形、珊瑚、动物、天空与声音全部由代码生成。\n- 所有材质用自写 GLSL 的 `ShaderMaterial`，并共享同一段“水下光学”GLSL，保证任何深度下风格一致。\n- 需要 WebGL2；不支持时给出中文提示。页面必须在 390px 宽的手机上不横向溢出。\n\n## 页面框架\n\n- 顶部一条细顶栏：左 `← 三方对照`（链接 `../../compare/index.html`），中间“深渊：活的深海” + 小标签「Opus 5.5 · 独立逆向」，右 `原作 @emollick ↗`（链接 https://x.com/emollick/status/2095673885605630429）。`?shot=1` 时隐藏顶栏，`?ui=0` 时隐藏界面。\n- 画布下方叠一层 HUD（风格：深色半透明方块按钮、米白墨色、大号衬线标题、等宽小字标签、淡绿色主按钮）：\n  - 左上 “ABYSSAL / 活的深海”；右上：上浮、下潜、探索（海图）、世界实验室、?。\n  - 右侧深度计：大号数字 + “水面以下/以上”，下方一条可点击的深度刻度 0 水面 / 200 暮光带 / 600 下暮光带 / 1,000 午夜带 / ≈1,400 热液区，并有随深度移动的标记。\n  - 左下标题区：随所处区域淡入切换的大标题与副标题（呼吸之海、珊瑚大教堂、沉没的森林、深入蔚蓝、暮光带、漫长的暮光、午夜之水、午夜花园、玄武岩平原），一行“附近 · 物种 · 物种…”；在海面时显示“潜入珊瑚礁”按钮。\n  - 底部四个生境标签（珊瑚礁 / 海藻林 / 开阔大洋 / 深渊，快捷键 1–4），当前区域有下划线。\n  - 右下工具栏：漂流、游动、暂停、潜水灯、观察、图鉴、截图（不含界面的 PNG），下方一行提示。\n  - 旅程进行中在顶部显示“正在前往 · X”进度条与“停在这里”。\n\n## 世界生成（同一片海）\n\n- 种子（数字或文字，文字哈希成稳定整数；默认 713）→ 在 4.8 km 见方范围内烘焙 768² 的 RG32F 高度图（高度 + 细节幅度）与 RGBA 生境图，再加一张 256² 可平铺细节噪声。GPU 顶点着色器用 `texelFetch` 手写双线性采样；CPU 用完全相同的公式采样，用于碰撞、动物贴地与路线规划。\n- 布局：北侧陆架（-15 到 -30 米）；西侧是沿东北向延伸的珊瑚脊与沙质水道，东侧是岩质海藻林与林间空地；陆架边缘突然坠入陆坡，一条蜿蜒峡谷从陆架切到深渊；南侧是约 -1400 米起伏的深渊平原，散布着热液带。可航行半径 2.2 km。\n- 四个站点（reef / kelp / blue / deep）与 11 个目的地（reef-ridges、reef-channels、reef-gardens、kelp-avenues、kelp-clearings、kelp-outer、shelf-edge、canyon-wall、vent-belt、basalt-plain、far-vents）都只是这片海里的坐标。\n- 镜头周围的地形用一张以镜头为中心、近密远疏的网格（近处约 0.75 米一格）实时采样高度图，并在片元里加沙纹、岩面凹凸、藻皮与生境着色。\n\n## 光与水\n\n- 三通道的下行衰减 Kd、视线衰减 Kv、散射系数 b；沿视线的内散射用解析积分（起点深度、方向、长度），水下穹顶就是 L→∞ 的积分。清澈度、上升流（更绿）、离岸（更清）、沉积物都只改这三组系数。\n- 焦散：两层随时间漂移的“绝对值噪声网”，沿折射后的太阳方向投影，随深度变弱变糊。\n- 沿折射太阳方向的 2048² 正交阴影图，只覆盖镜头前方约 64 米。\n- 自动曝光；潜水相机式部分白平衡（浅处按阳光路径、深处按潜水灯往返路径补偿红光）。\n- 两盏潜水灯（自动随深度亮起，可手动覆盖）。生物发光的强度按 1/曝光 缩放。\n- 后期：半分辨率体积光（阳光光柱 + 灯光光束）、两级泛光、ACES、暗角与细颗粒。镜头靠近水线时把场景渲两遍，逐像素用 GLSL 里的浪高判断水上/水下，做出随浪移动的分屏与暗色水膜线。\n\n## 海面与天空\n\n- 12 个 Gerstner 波（由风速估算峰值波长与波高，加上涌浪），CPU 与 GPU 同参数；漂浮镜头用 CPU 迭代反解真实浪高并随浪倾斜。海面从空中看：天空反射 + 太阳高光 + 浪峰次表面散射 + 雅可比泡沫；从水下看：斯涅尔窗与全反射。事件波：海底震颤的环形波列、畸形浪波包。\n- 天空：解析大气渐变 + 在云层薄壳里 14 步步进的积云（阈值随高度升高形成圆顶，朝太阳采样做自阴影与银边）+ 夜空的星、月与银河带；雨线与分叉闪电。夜里上升流喂养的表层藻华在浪峰被扰动时发出青绿色光。\n\n## 景物（程序化 + 实例化）\n\n- 分层石灰岩台地（顶上长珊瑚）、巨石、陆坡石柱、玄武岩、鹿角珊瑚、脑珊瑚、桌状珊瑚、海扇、海鞭、管状与桶状海绵、巨藻（高度随水深与“海藻高度”旋钮，顶点着色器弯曲并随波浪涌动）、海草丛、冷水珊瑚、矿物烟囱（顶上升起羽流粒子）与管虫丛。\n- 以 32 米地块、世界坐标为种子播种；只展开镜头附近的地块，逐帧做视锥与距离剔除；回到同一地点群落不变。\n\n## 动物（约 30 个物种群体）\n\n- 珊瑚礁：蝴蝶鱼、鹦嘴鱼、雀鲷、礁鲨、蝠鲼、章鱼、螃蟹、海星、海胆；海藻林：海豹、银色鱼群、海龟；蔚蓝：座头鲸、海豚、金枪鱼、翻车鱼、鱿鱼；200–1000 米：灯笼鱼、斧头鱼、中层水虾、吸血鬼乌贼、龙鱼；1000 米以下：鮟鱇、宽咽鱼、烟灰蛸；深海底：大王具足虫、蛇尾、海参、海鳃、热泉虾；漂流者：水母、管水母。\n- 每个物种一套程序化解剖（放样躯干、尾鳍/背鳍/臀鳍/胸鳍、腕足、眼睛、发光器官），顶点属性记录脊柱坐标、拍动权重、腕编号、发光与收缩，通用顶点着色器做身体波动、鳍的拍动、腕的卷曲、步足交替与伞体收缩。\n- 30Hz 固定步长 + 插值渲染：鱼群分离/对齐/聚合，前瞻避地形与大石，被掠食者或正在游动的潜水员惊散后重聚；礁鱼游到岩面低头啄食；掠食者偶尔追向附近的猎物群；海豚、海豹、海龟、座头鲸周期性上浮换气；底栖动物走一段停一段、螃蟹横行；鱿鱼喷水后退；水母脉动漂流；热泉虾围着烟囱打转；转弯时侧倾。暂停时位置与附肢一起冻结；漂流模式下镜头不惊扰动物。\n- 群落按镜头周围的生境适宜度加载与回收，初次生成多放在镜头前方；深处群落半径收拢到潜水灯范围。实验室里显示的是当前加载的数量。\n\n## 交互\n\n- 漂流 / 游动（WASD 沿视线游动、拖动环顾、Q/E 下沉上升、Shift 加速、滚轮缩放）；上浮、沿峡谷下潜（已在深水区则直接下沉）、深度站点、1–4 生境旅程、海图目的地或海图任意一点；旅程沿地形平滑并可“停在这里”。\n- 世界实验室四个页签：世界（种子、新种子、地形起伏、生物覆盖、海藻高度、生境尺度、重置配方、复制世界链接）、生命（动物丰度、掠食者、底栖生物、水母与漂流者、鱼群规模、当前加载数量）、水体（清澈度、洋流、生物发光、深层上升流、潜水灯 自动/开/关、海洋声音与音量）、天气（白天/黄昏/风暴/夜晚、太阳高度、云量、风速、涌浪、风暴强度，展开更多：风向、涌浪周期、浪尖陡度、降雨、雾霾、云密度；事件：海底震颤、畸形浪、闪电）；底部“视图与控制”：在水线漂浮、画质、帧率、操作说明。地形类旋钮松开时重建，天气与水体旋钮拖动时实时生效。\n- 观察（O）：选中视野里看得清的动物，屏幕上用四角括号跟随，卡片显示名称、描述、距离与深度，可“跟随”（镜头缓缓移到舒适距离）、“下一个”；点画面上的动物也能选中。\n- 野外图鉴（J）：动物需要在画面里停留约 1 秒、距离足够近、没被地形挡住、并且被阳光/潜水灯/自身发光照亮才记录；记录首次深度与种子，存在 localStorage（读写包 try/catch）。\n- 海洋声音（M，默认关闭）：WebAudio 实时合成浪涌、水下低鸣、礁区噼啪、远处的鲸歌、热泉嘶声与震颤低频。\n- 快捷键：G 实验室、R 新种子、C 海图、L 潜水灯、P 暂停、H 隐藏界面、F 漂流/游动、Esc 关闭。\n- URL 参数：`site`、`place`、`seed`、`light`（day/dusk/storm/night）、`surface`（1 / waterline）、`depth`（200/600/1000/vent）、`relief`、`cover`、`height`、`habitatScale`、`life`、`predators`、`benthos`、`jellies`、`shoal`、`clarity`、`current`、`glow`、`upwelling`、`lamp`、`preset`、`adaptive=0`。\n- 自适应内部分辨率保帧率；手机默认低画质（关闭阴影）。\n\n## 交付\n\n`index.html`、`css/`、`js/`（按模块拆分：noise、world、optics、sky、surface、terrain、post、geom、scenery、fauna-geo、species、fauna、particles、explore、sound、ui、main）、`vendor/`。完成后用无头浏览器在海面、珊瑚礁、海藻林、蔚蓝、600 米、热液花园、夜晚、风暴、水线与 390px 手机视口逐一截图检查，确认没有控制台报错。",
    promptEn: "# Prompt for generating this work in one shot\n\n> Build a statically hostable web piece, \"Abyss: The Living Deep\" (an homage remake of ABYSSAL: The Living Deep). It is a procedural ocean you can explore continuously: starting from a camera bobbing on the waves at the surface, dive all the way down to 1,400 m, all generated from a single seed, with the entire interface in Chinese.\n\n## Technical constraints\n\n- Use only three.js (put `three.module.js` and `three.core.js` in `vendor/` and load them via an importmap); ES Modules, no build step, relative paths only, no CDN dependencies.\n- No texture, model, font or audio files; terrain, coral, animals, sky and sound are all generated in code.\n- Every material is a `ShaderMaterial` with hand-written GLSL, all sharing one \"underwater optics\" GLSL snippet so the style stays consistent at every depth.\n- Requires WebGL2; show a message in Chinese when unsupported. The page must not overflow horizontally on a 390px-wide phone.\n\n## Page frame\n\n- A thin top bar: left `← Three-way comparison` (link `../../compare/index.html`), center \"Abyss: The Living Deep\" plus a small tag \"Opus 5.5 · Solo rebuild\", right `Original @emollick ↗` (link https://x.com/emollick/status/2095673885605630429). Hide the top bar with `?shot=1`, and hide the UI with `?ui=0`.\n- A HUD layered over the canvas (style: dark translucent square buttons, off-white ink, large serif titles, small monospace labels, pale green primary button):\n  - Top left \"ABYSSAL / The Living Deep\"; top right: Surface, Dive, Explore (chart), World Lab, ?.\n  - Depth gauge on the right: a large number plus \"below/above the surface\", with a clickable depth scale beneath — 0 surface / 200 twilight zone / 600 lower twilight / 1,000 midnight zone / ≈1,400 vent field — and a marker that moves with depth.\n  - Title area at bottom left: a large title and subtitle that fade in and change with the current zone (Breathing Sea, Coral Cathedral, Sunken Forest, Into the Blue, Twilight Zone, The Long Twilight, Midnight Waters, Midnight Garden, Basalt Plain), a line \"Nearby · species · species…\"; at the surface, show a \"Dive into the reef\" button.\n  - Four habitat tabs along the bottom (Reef / Kelp Forest / Open Ocean / Abyss, shortcuts 1–4), with the current zone underlined.\n  - Toolbar at bottom right: Drift, Swim, Pause, Dive Lamp, Observe, Field Guide, Screenshot (a PNG without the UI), with a hint line below.\n  - During a journey, show a \"Heading to · X\" progress bar at the top plus \"Stop here\".\n\n## World generation (one ocean)\n\n- Seed (a number or text; text is hashed to a stable integer; default 713) → bake a 768² RG32F heightmap (height + detail amplitude) and an RGBA habitat map over a 4.8 km square, plus a 256² tileable detail-noise texture. The GPU vertex shader does hand-written bilinear sampling with `texelFetch`; the CPU samples with exactly the same formula for collisions, placing animals on the ground and route planning.\n- Layout: a continental shelf to the north (-15 to -30 m); in the west, coral ridges running northeast with sandy channels between them; in the east, a rocky kelp forest with clearings; the shelf edge drops abruptly onto the slope, and a winding canyon cuts from the shelf to the abyss; in the south, an undulating abyssal plain at about -1,400 m dotted with vent fields. Navigable radius 2.2 km.\n- Four stations (reef / kelp / blue / deep) and 11 destinations (reef-ridges, reef-channels, reef-gardens, kelp-avenues, kelp-clearings, kelp-outer, shelf-edge, canyon-wall, vent-belt, basalt-plain, far-vents) are just coordinates in this one ocean.\n- Terrain around the camera uses a camera-centered grid that is dense near and sparse far (about 0.75 m per cell up close), sampling the heightmap in real time, with sand ripples, rock relief, algae skin and habitat coloring added in the fragment shader.\n\n## Light and water\n\n- Three-channel downwelling attenuation Kd, line-of-sight attenuation Kv and scattering coefficient b; in-scattering along the view ray uses an analytic integral (start depth, direction, length), and the underwater dome is simply the integral with L→∞. Clarity, upwelling (greener), offshore (clearer) and sediment only change these three sets of coefficients.\n- Caustics: two layers of time-drifting \"absolute-value noise nets\", projected along the refracted sun direction, getting weaker and blurrier with depth.\n- A 2048² orthographic shadow map along the refracted sun direction, covering only about 64 m in front of the camera.\n- Auto-exposure; partial white balance like a dive camera (compensating red along the sunlight path in the shallows, and along the lamp's round-trip path at depth).\n- Two dive lamps (switch on automatically with depth, manual override available). Bioluminescence intensity scales with 1/exposure.\n- Post-processing: half-resolution volumetric light (sun shafts + lamp beams), two-level bloom, ACES, vignette and fine grain. When the camera is near the waterline, render the scene twice and decide above/below water per pixel from the wave height in GLSL, producing a split view that moves with the waves and a dark water-film line.\n\n## Sea surface and sky\n\n- 12 Gerstner waves (peak wavelength and height estimated from wind speed, plus swell), with identical parameters on CPU and GPU; the floating camera solves the true wave height iteratively on the CPU and tilts with the waves. From above, the surface shows sky reflection + sun glint + subsurface scattering at wave crests + Jacobian foam; from below, Snell's window and total internal reflection. Event waves: ring-shaped wave trains from seafloor tremors, rogue-wave packets.\n- Sky: an analytic atmospheric gradient + cumulus ray-marched in 14 steps within a thin cloud shell (threshold rising with height to form domes, sampling toward the sun for self-shadowing and silver lining) + stars, moon and Milky Way band at night; rain streaks and forked lightning. At night, surface algal blooms fed by upwelling glow teal-green where wave crests disturb them.\n\n## Scenery (procedural + instanced)\n\n- Layered limestone terraces (topped with coral), boulders, slope pillars, basalt, staghorn coral, brain coral, table coral, sea fans, sea whips, tube and barrel sponges, giant kelp (height follows water depth and the \"kelp height\" knob, bent in the vertex shader and surging with the waves), seagrass clumps, cold-water coral, mineral chimneys (plume particles rising from the top) and tubeworm clusters.\n- Seed per 32 m tile using world coordinates; only expand tiles near the camera, with per-frame frustum and distance culling; returning to the same spot yields the same community.\n\n## Animals (about 30 species groups)\n\n- Reef: butterflyfish, parrotfish, damselfish, reef sharks, manta rays, octopus, crabs, starfish, sea urchins; kelp forest: seals, silver fish schools, sea turtles; blue water: humpback whales, dolphins, tuna, ocean sunfish, squid; 200–1,000 m: lanternfish, hatchetfish, midwater shrimp, vampire squid, dragonfish; below 1,000 m: anglerfish, gulper eels, dumbo octopus; deep seafloor: giant isopods, brittle stars, sea cucumbers, sea pens, vent shrimp; drifters: jellyfish, siphonophores.\n- Each species gets its own procedural anatomy (lofted body, caudal/dorsal/anal/pectoral fins, arms, eyes, light organs); vertex attributes record spine coordinate, flap weight, arm index, glow and contraction, and a shared vertex shader handles body undulation, fin beats, arm curling, alternating leg gaits and bell contraction.\n- 30 Hz fixed timestep + interpolated rendering: schools use separation/alignment/cohesion, look ahead to avoid terrain and large rocks, scatter when a predator or a swimming diver approaches and then regroup; reef fish swim to rock faces and dip to peck; predators occasionally chase nearby prey schools; dolphins, seals, turtles and humpbacks surface periodically to breathe; bottom dwellers walk and pause, crabs scuttle sideways; squid jet backwards; jellyfish pulse and drift; vent shrimp circle the chimneys; animals bank as they turn. On pause, positions and appendages freeze together; in drift mode the camera doesn't startle animals.\n- Communities are loaded and recycled by habitat suitability around the camera, with initial spawns biased in front of the camera; at depth, the community radius shrinks to the dive-lamp range. The Lab shows the currently loaded counts.\n\n## Interaction\n\n- Drift / Swim (WASD to swim along the view direction, drag to look around, Q/E to sink/rise, Shift to speed up, wheel to zoom); Surface, Dive along the canyon (sinking straight down if already in deep water), depth stations, 1–4 habitat journeys, chart destinations or any point on the chart; journeys smooth along the terrain and can \"Stop here\".\n- World Lab with four tabs: World (seed, new seed, terrain relief, life coverage, kelp height, habitat scale, reset recipe, copy world link), Life (animal abundance, predators, benthos, jellyfish and drifters, school size, currently loaded count), Water (clarity, current, bioluminescence, deep upwelling, dive lamp auto/on/off, ocean sound and volume), Weather (day/dusk/storm/night, sun height, cloud cover, wind speed, swell, storm intensity; expand for more: wind direction, swell period, crest steepness, rain, haze, cloud density; events: seafloor tremor, rogue wave, lightning); at the bottom, \"View & controls\": float at the waterline, quality, frame rate, instructions. Terrain knobs rebuild on release; weather and water knobs take effect live while dragging.\n- Observe (O): select a clearly visible animal in view, track it on screen with corner brackets, and show a card with name, description, distance and depth, with \"Follow\" (the camera eases to a comfortable distance) and \"Next\"; clicking an animal in the scene also selects it.\n- Field Guide (J): an animal is only recorded after staying in view for about 1 second, close enough, not occluded by terrain, and lit by sunlight / dive lamp / its own glow; record the depth and seed of the first sighting and store it in localStorage (reads and writes wrapped in try/catch).\n- Ocean sound (M, off by default): WebAudio synthesizes surf, an underwater drone, reef crackle, distant whale song, vent hiss and low-frequency tremor rumble in real time.\n- Shortcuts: G Lab, R new seed, C chart, L dive lamp, P pause, H hide UI, F drift/swim, Esc close.\n- URL parameters: `site`, `place`, `seed`, `light` (day/dusk/storm/night), `surface` (1 / waterline), `depth` (200/600/1000/vent), `relief`, `cover`, `height`, `habitatScale`, `life`, `predators`, `benthos`, `jellies`, `shoal`, `clarity`, `current`, `glow`, `upwelling`, `lamp`, `preset`, `adaptive=0`.\n- Adaptive internal resolution to hold frame rate; low quality by default on phones (shadows off).\n\n## Delivery\n\n`index.html`, `css/`, `js/` (split into modules: noise, world, optics, sky, surface, terrain, post, geom, scenery, fauna-geo, species, fauna, particles, explore, sound, ui, main), `vendor/`. When done, use a headless browser to screenshot and check the surface, coral reef, kelp forest, open blue, 600 m, vent garden, night, storm, waterline and a 390px phone viewport one by one, and confirm there are no console errors.",
    promptNote: "隔离记忆的子代理完成作品后，自己整理的一次性生成 prompt；未验证单次输入即可复现同等成品。"

    prompt: "# 一次性生成 Prompt\n\n请用 Three.js（ES Module + importmap，本地 `vendor/` 引用，无构建、无 CDN）做一个单页网页：**可动手探索的交互式 V8 发动机**。界面文字全部中文，深色工程风格，桌面端与 390px 手机端都可用、不得横向溢出。\n\n## 1. 物理与运动学（先写成纯函数模块 `physics.js`，所有显示都由它驱动）\n- 发动机参数：90° V8，缸径 94 mm、行程 92 mm、连杆 150 mm、压缩比 11:1，DOHC 每缸 4 气门。\n- 横置平面曲轴，点火顺序 1-8-4-3-6-5-7-2（奇数缸一列、偶数缸一列，每个曲柄销驱动两列各一缸）。**不要手写每缸相位**：给定点火顺序（每 90° 点火一次）和缸列角 ±45°，反解出曲柄销角度（应得到四销互成 90°，同销两缸一致）。曲轴从前端看顺时针旋转。\n- 定义单缸循环角 ψ = θ − 该缸点火相位，0° = 压缩上止点：0–180 做功、180–360 排气、360–540 进气、540–720 压缩。\n- 活塞位移用精确的曲柄连杆公式；连杆两端分别跟随曲柄销和活塞销。\n- 气门正时：IVO 12° BTDC、IVC 48° ABDC、EVO 52° BBDC、EVC 10° ATDC（重叠 22°），升程曲线用平滑的多项式型线，进气 11.8 mm、排气 11.2 mm；进气凸轮支持 VVT 相位偏移（−20°～+40°）。\n- 缸压：单区热力学（多变压缩/膨胀）+ Wiebe 燃烧放热（点火延迟、燃烧持续角随负荷/转速变化），从 IVC 积分到 EVO，之后指数衰减的自由排气、背压排气、按节气门决定的进气歧管压力。输出 0.5° 分辨率的 p、V、已燃分数、放热率、温度，以及峰值压力与位置、IMEP、扭矩、功率、爆震指数。目标量级：WOT 3000 rpm、提前角 26° 时峰值约 65–70 bar @ 约 14° ATDC。\n\n## 2. 三维模型（全部程序化几何，禁止外部模型）\n- 缸体：每列用“带缸孔与螺栓孔的截面”沿缸轴拉伸；曲轴箱用前视轮廓（U 形 + 谷底 V 形隔板）沿曲轴方向拉伸；主轴承隔板、油底壳；所有壳体必须是封闭实体。\n- 曲轴：带配重的曲臂（2D 轮廓挤出）、曲柄销、主轴颈、前端链轮与减振皮带轮、后端飞轮与齿圈。\n- 连杆（I 字梁 + 螺栓）、活塞（车削体，环槽 + 三道活塞环 + 活塞销）。\n- 缸盖、凸轮罩、4 根凸轮轴：**凸轮型线用升程曲线按极坐标生成（凸轮 1° = 曲轴 2°）**，每个凸轮按其缸的相位安装；桶形挺柱、气门弹簧（进气蓝、排气橙，随升程压缩）、气门。\n- 正时链（两条，实例化链节沿“多圆凸包切线路径”运动，2:1）、火花塞与独立点火线圈、进气稳压腔 + 8 根进气道 + 带转动蝶阀的节气门体、两侧 4-into-1 排气歧管、前端水泵/发电机/多楔带。\n- 缸内气体体积：高度随活塞变化；进气蓝 → 压缩紫 → 从火花塞扩张的火焰前锋 → 做功橙红 → 排气褐；点火瞬间火花闪光；排气门打开时对应排气管短暂发红。\n- 气流粒子：沿“稳压腔 → 进气道 → 进气门 → 缸内”和“缸内 → 排气门 → 歧管 → 集管”路径流动，速度与气门升程和活塞速度成正比、随慢放同步变慢。\n\n## 3. 视图模式\n- 外观：完整发动机。\n- 剖切（默认）：每列壳体用过缸轴线的裁剪平面切掉谷侧一半，曲轴箱切掉上半，截面用红色斜线着色（背面着色技巧）；缸盖换成燃烧室板 + 凸轮轴承座骨架，进气歧管显示为淡幽灵材质。\n- 透视：壳体为菲涅尔边缘发光的半透明材质，内部零件实体。\n- 原理图：一条扫描平面横扫，把实体“擦”成蓝图线稿（填充 + 菲涅尔轮廓 + 棱线，内部零件消隐），同时摄像机做 dolly-zoom 变成近正交前视图，背景变为蓝图网格，叠加 SVG 标注：90° 夹角弧与中心线、缸径 Ø94、行程 92、凸轮轴与曲轴中心引线、图框标题栏。线稿中活塞和气体继续运动；可反向转场回 3D。\n- 机位预设：全景 / 前视 / 俯视 / 侧视，OrbitControls 阻尼。\n\n## 4. 交互与面板\n- 左侧：品牌块；四冲程按钮（进气/压缩/做功/排气，点击后曲轴向前平滑转到聚焦缸的该冲程并暂停），当前冲程说明卡（中文原理 + 进/排气门开度、活塞方向、实时缸压）；聚焦气缸选择（左列 2468 / 右列 1357，键盘 1–8）；视图模式；部件标签（曲轴、连杆、活塞、凸轮轴、气门机构、正时链、火花塞/线圈、缸体、缸盖、前端附件、进气歧管、排气歧管）——选中后该部件脉冲发光、其余虚化，并显示中文讲解卡；3D 中悬停显示部件名、点击选中（拾取需排除被裁剪掉的部分）。\n- 右侧：转速/扭矩/功率/IMEP 指标；“工作循环”图（p–θ 线性/对数与气门升程叠图，冲程色带、点火线、峰值标注、游标；可切到对数 p–V 环线并注明指示功）；气门正时圆图（TDC 在上、顺时针、内圈进气外圈排气、重叠扇区、点火标记、随 ψ 旋转的曲柄指针）；点火顺序条（当前做功缸点亮）+ 8 缸 × 720° 相位图（点击行切换聚焦缸）；调参滑块：转速、节气门、点火提前角、VVT，实时重算，并给出“点火过早/偏晚/合适 + 当前工况 MBT”的解释（MBT 通过扫描提前角求最大 IMEP 得到）与爆震警示。\n- 底部传动条：播放/暂停（空格）、±5° 步进（方向键）、以聚焦缸 ψ 为轴、带冲程色带的可拖动刻度条、曲轴角/本缸角读数、慢放档位（1/400～实时）、声音开关。\n- 声音：WebAudio 在每缸排气门打开时刻合成一次排气脉冲，奇数列偏右、偶数列偏左声像，慢放时是独立脉冲，实时时连成 V8 轰鸣。\n- 3D 中每缸上方有按当前冲程着色的编号标签，点火时闪一下；顶部中央大字显示聚焦缸当前冲程。\n\n## 5. 视觉\n- 深石墨背景 + 渐隐网格地面 + 接触阴影 + 暗角；RoomEnvironment 反射 + 暖色主光 + 冷色轮廓光；UnrealBloom 只作用于燃烧与火花（阈值调高避免金属高光溢出），ACES 色调映射。\n- 冲程配色固定：进气 #3fa9ff、压缩 #9a86ff、做功 #ff6a2b、排气 #dba445，所有图表与 3D 保持一致。\n- 面板为半透明毛玻璃卡片，数字用等宽字体。桌面端把 3D 画面的视觉中心偏移到两侧面板之间；≤980px 时面板移到 3D 视图下方纵向排列。",
    promptEn: "# One-shot generation prompt\n\nUsing Three.js (ES Modules + importmap, loaded from a local `vendor/`, no build, no CDN), build a single-page site: **an interactive V8 engine you can explore hands-on**. All interface text in Chinese, a dark engineering style, usable on desktop and on a 390px phone with no horizontal overflow.\n\n## 1. Physics and kinematics (write these first as a pure-function module `physics.js`; everything on screen is driven by it)\n- Engine parameters: 90° V8, 94 mm bore, 92 mm stroke, 150 mm connecting rod, 11:1 compression ratio, DOHC with 4 valves per cylinder.\n- Cross-plane crankshaft, firing order 1-8-4-3-6-5-7-2 (odd cylinders on one bank, even on the other, each crankpin driving one cylinder from each bank). **Do not hand-code each cylinder's phase**: given the firing order (one firing every 90°) and bank angles of ±45°, solve for the crankpin angles (you should get four pins 90° apart, with the two cylinders on a pin in agreement). The crankshaft rotates clockwise viewed from the front.\n- Define each cylinder's cycle angle ψ = θ − that cylinder's firing phase, with 0° = compression TDC: 0–180 power, 180–360 exhaust, 360–540 intake, 540–720 compression.\n- Piston travel uses the exact slider-crank formula; each end of the connecting rod follows the crankpin and the wrist pin respectively.\n- Valve timing: IVO 12° BTDC, IVC 48° ABDC, EVO 52° BBDC, EVC 10° ATDC (22° overlap); lift curves use smooth polynomial profiles, 11.8 mm intake and 11.2 mm exhaust; the intake cam supports VVT phase offset (−20° to +40°).\n- Cylinder pressure: single-zone thermodynamics (polytropic compression/expansion) + Wiebe combustion heat release (ignition delay and burn duration varying with load/speed), integrated from IVC to EVO, followed by exponentially decaying blowdown, back-pressure exhaust, and intake manifold pressure set by the throttle. Output p, V, burned fraction, heat-release rate and temperature at 0.5° resolution, plus peak pressure and its location, IMEP, torque, power and a knock index. Target magnitude: at WOT, 3000 rpm and 26° advance, a peak of about 65–70 bar at about 14° ATDC.\n\n## 2. 3D model (all procedural geometry; no external models)\n- Block: each bank is a \"cross-section with bores and bolt holes\" extruded along the cylinder axis; the crankcase is a front-view profile (U shape + V-shaped valley web) extruded along the crankshaft; main bearing webs and oil pan; every shell must be a closed solid.\n- Crankshaft: counterweighted crank webs (extruded 2D profiles), crankpins, main journals, front sprocket and harmonic damper pulley, rear flywheel with ring gear.\n- Connecting rods (I-beam + bolts), pistons (lathed bodies with ring grooves + three piston rings + wrist pin).\n- Cylinder heads, cam covers and 4 camshafts: **generate cam profiles from the lift curve in polar coordinates (1° of cam = 2° of crank)**, each lobe mounted at its cylinder's phase; bucket tappets, valve springs (intake blue, exhaust orange, compressing with lift) and valves.\n- Timing chains (two, with instanced links moving along a \"tangent path around the convex hull of several circles\", 2:1), spark plugs with coil-on-plug units, an intake plenum + 8 runners + a throttle body with a rotating butterfly, 4-into-1 exhaust manifolds on both sides, and front-end water pump / alternator / serpentine belt.\n- In-cylinder gas volume: height follows the piston; intake blue → compression purple → a flame front spreading from the spark plug → power orange-red → exhaust brown; a spark flash at ignition; when an exhaust valve opens, its exhaust pipe glows red briefly.\n- Airflow particles: flowing along \"plenum → runner → intake valve → cylinder\" and \"cylinder → exhaust valve → manifold → collector\", with speed proportional to valve lift and piston speed, slowing in sync with slow motion.\n\n## 3. View modes\n- Exterior: the complete engine.\n- Cutaway (default): each bank's shell is cut away on its valley side by a clipping plane through the cylinder axis, the crankcase's top half is removed, and cut faces are shaded with red hatching (back-face shading trick); cylinder heads become combustion-chamber plates plus a cam-bearing skeleton, and the intake manifold appears as a faint ghost material.\n- X-ray: shells are translucent with Fresnel rim glow, internal parts solid.\n- Schematic: a scan plane sweeps across and \"wipes\" the solids into blueprint line art (fill + Fresnel outline + edges, internal parts hidden), while the camera does a dolly zoom into a near-orthographic front view, the background becomes a blueprint grid, and SVG annotations are overlaid: the 90° angle arc and centerlines, bore Ø94, stroke 92, leader lines to the camshaft and crankshaft centers, and a title block. Pistons and gas keep moving in the line art; the transition can reverse back to 3D.\n- Camera presets: overview / front / top / side, with damped OrbitControls.\n\n## 4. Interaction and panels\n- Left: brand block; four-stroke buttons (intake/compression/power/exhaust — clicking smoothly turns the crankshaft forward until the focused cylinder reaches that stroke, then pauses); a current-stroke card (the principle in Chinese + intake/exhaust valve opening, piston direction, live cylinder pressure); focused-cylinder selection (left bank 2468 / right bank 1357, keys 1–8); view mode; part tags (crankshaft, connecting rods, pistons, camshafts, valvetrain, timing chain, spark plugs/coils, block, heads, front accessories, intake manifold, exhaust manifolds) — selecting one makes that part pulse and glow while the rest fade, and shows an explanation card in Chinese; hovering in 3D shows the part name and clicking selects it (picking must exclude clipped-away portions).\n- Right: rpm / torque / power / IMEP readouts; a \"working cycle\" chart (p–θ in linear/log with valve lift overlaid, stroke color bands, ignition line, peak annotation, cursor; switchable to a log p–V loop labeled with indicated work); a valve-timing circle (TDC at top, clockwise, intake on the inner ring and exhaust on the outer, overlap sector, ignition mark, a crank pointer rotating with ψ); a firing-order strip (the cylinder currently on its power stroke lit) + an 8-cylinder × 720° phase chart (click a row to change the focused cylinder); tuning sliders for rpm, throttle, ignition advance and VVT, recomputed live, with an explanation of \"too early / too late / about right + MBT for current conditions\" (MBT found by sweeping advance for maximum IMEP) and a knock warning.\n- Bottom transport bar: play/pause (space), ±5° steps (arrow keys), a draggable scale with stroke color bands keyed to the focused cylinder's ψ, crank angle / cylinder angle readouts, slow-motion settings (1/400 to real time), and a sound toggle.\n- Sound: WebAudio synthesizes one exhaust pulse at each cylinder's exhaust-valve opening, panning odd banks right and even banks left; in slow motion these are separate pulses, and at real time they merge into a V8 rumble.\n- In 3D, each cylinder has a number label above it colored by its current stroke, flashing at ignition; large text at top center shows the focused cylinder's current stroke.\n\n## 5. Visuals\n- Deep graphite background + a fading grid floor + contact shadows + vignette; RoomEnvironment reflections + a warm key light + a cool rim light; UnrealBloom applied only to combustion and sparks (threshold raised so metal highlights don't bloom), ACES tone mapping.\n- Fixed stroke colors: intake #3fa9ff, compression #9a86ff, power #ff6a2b, exhaust #dba445, consistent across all charts and 3D.\n- Panels are translucent frosted-glass cards with monospace numbers. On desktop, offset the visual center of the 3D view to sit between the two side panels; at ≤980px, move the panels below the 3D view and stack them vertically.",

    prompt: "# 一次性生成 Prompt\n\n> 你是一名兼做 GIS 数据工程与实时图形的前端工程师。请做一个名为 **「首尔 3D 地图集」** 的网页：一块可以旋转、缩放的首尔微缩沙盘。数据要真实，观感要像桌面模型，还要带地标飞越导览和连续的昼夜光照。交付物是一个无需构建、可直接静态托管的目录。\n\n## 一、交付与约束\n- 目录结构：`index.html`、`css/style.css`、`js/{main,geo,landmarks}.js`、`data/*`、`vendor/three/*`。\n- 只用相对路径，禁止 CDN。three.js r170 通过 `npm pack three@0.170.0` 拿到，拷入 `vendor/three/`（`three.module.min.js`，以及 addons 里的 OrbitControls、EffectComposer、RenderPass、ShaderPass、UnrealBloomPass、OutputPass 及其依赖），用 importmap 映射 `three` 和 `three/addons/`。\n- 界面全部用中文，地名附韩文。页面顶部有一条 36px 的细顶栏：左边 `← 三方对照`，中间作品名加小标签，右边链接原作。\n- 手机 390px 宽时不能横向溢出，面板改为底部抽屉。\n\n## 二、离线数据管线（Python：pyarrow、shapely、numpy、Pillow、scipy）\n1. **范围与投影**：以首尔市厅（126.978E, 37.5665N）为原点做等距投影，1 单位 = 1 km，x 向东、z 向南。沙盘范围 x∈[-21.8, 21.8]、z∈[-18.6, 18.9]。\n2. **取数**：从 Overture Maps 在 S3 上的 GeoParquet（`overturemaps-us-west-2/release/<最新>/theme=*/type=*`）读取。先读每个文件的 footer，按 row group 的 bbox 统计筛选，再用 HTTP Range 只拉相交的 row group。需要的图层：buildings/building、transportation/segment（含 road_flags 里的 is_bridge / is_tunnel 区间）、base/water、base/land_use、base/land_cover、base/land、divisions/division_area（取首尔 25 个 county）。\n3. **地形**：AWS Terrain Tiles 的 Terrarium z12 瓦片，重采样成 728×626 的网格（int16，单位 0.1 m）。在水域掩码内把地形压到水位（3 m）以下，陆地不低于 5.5 m；大面积的汉江压平，支流按邻域最低点下挖。\n4. **建筑**：丢弃面积小于 60 ㎡ 和地下建筑，以及落在水里、地标保留区内的建筑。取最小外接旋转矩形，按面积比例缩小。高度优先用 height，其次用 num_floors×3.3+2；都缺失时按规则估算：住宅用地内、长宽比 ≥1.9、短边 9–24 m 的板楼判为公寓，高 36–70 m；小房子 5–9 m；商业大体量 18–42 m；学校和工厂压低。类型编码为：独栋、中层、公寓、玻璃塔、工业、公共、韩屋（宫阙周边）；最高位标记“首尔市界外”。每栋存 14 字节：x、z 各 uint16 量化，宽、深、高、基底高程各 uint16（单位 0.1 m），角度 uint8，类型 uint8。整体按体量降序排列。\n5. **烘焙纹理（4096×3524）**：\n   - `ground.jpg`：土地覆盖与用地配色，市界外降低饱和度；次级道路与铁路画成细线；全部建筑足迹画成屋顶色块并加一圈模糊接触阴影；水面填河床色。\n   - `night.jpg`：道路按等级画成暖橙色光线，叠加模糊泛光，再按建筑密度加辉光；市界外调暗，水面为黑。\n   - `water.png`（水域掩码，轻微模糊）；`mask.png`（R 为水、G 为绿地、B 为首尔市界内）。\n6. **meta.json**：主干道（高速、快速路、主干、次干）每 40 m 加密一次的折线，每个点带标记（0 普通、1 桥、2 隧道），并按沙盘范围裁剪；25 个区的多边形（简化到 25 m），附代表点与面积；首尔市界。\n7. **trees.bin**：在森林、公园、墓地、高尔夫等掩码内按概率撒 7 万棵树，每棵存 x、z、尺寸、类型。\n\n## 三、渲染\n- **地形**：索引网格，法线用中心差分计算。使用 MeshStandardMaterial，通过 `onBeforeCompile` 注入以下内容：\n  - 用 `water.png` 在像素级判定水面：水色随时间变化，粗糙度 0.16，法线加上三组正弦波纹（按 `fwidth` 在远处淡出），菲涅尔项反射天空色；\n  - 夜间自发光为 `pow(night.jpg, 2.3) × 夜色系数 × 随相机距离衰减的系数`；水面用 mip 偏置 5 采样灯光图，作为模糊倒影；\n  - 季节色乘在绿地掩码上；下雪时铺白，下雨时整体变暗、粗糙度降低。\n- **沙盘**：四边侧壁采样地形边缘，贴土层条纹纹理；底部是深色木质底座、黄铜饰条，南面有一块铭牌。\n- **建筑**：12×10 个区块，每块一个 InstancedMesh（去掉底面的单位盒，底边在 y=0），实例属性 `aInfo = (宽, 夸张后高度, 深, 类型)`。每块内部按 `max(宽, 深, 高×1.6)` 降序排序；每帧算出最小可见尺寸 `1.3px × 距离 / 焦距`，二分查找后设置 `mesh.count`。片元着色器：\n  - 按类型和哈希取墙色与屋顶色，屋顶约 40% 刷绿色防水漆；\n  - 按层高 × 窗宽划分窗格，并用 `fwidth` 抗锯齿；窗格小于像素时过渡到平均值；\n  - 墙体底部做 AO 压暗；\n  - 夜间窗格按哈希和亮灯率点亮，暖色与冷白色混合；远处降到 25% 并统一为暖色；玻璃塔顶部加灯带。\n- **桥梁**：只为桥段生成几何体。桥面高度取两端引桥高度插值、加一点拱度，并保证离水面有净空；侧面带夜间灯带；跨水段每 3 个点放一个桥墩。\n- **车流**：14,000 个 Points 沿主干道折线靠右行驶，时间做了缩放。白天为各色车身，夜间正向为白色车头灯、反向为红色尾灯（HDR 值，参与 Bloom）。\n- **天空**：天球着色器，按太阳高度角在 7 个关键帧之间插值；包含太阳盘与光晕、地平线辉光、星空（哈希加闪烁）和月亮。\n- **光照**：太阳方向用首尔纬度与赤纬的公式计算；太阳高度低于 -2° 时主光切换为月光。阴影相机每帧跟随视点，半径 = 相机距离 × 0.75，并按纹素对齐。\n- **后期**：HalfFloat + 4×MSAA 的 RenderTarget → UnrealBloom（夜间增强）→ 两遍可分离的移轴模糊（强度随俯仰角变化）→ 暗角与饱和度 → OutputPass（ACES）。\n- **自适应画质**：帧率低于 28 时降低像素比、提高 LOD 阈值，高于 55 时回升。\n\n## 四、地标（22 处，程序化建模，给出真实经纬度）\n北汉山白云台、景福宫、昌德宫、光化门广场、清溪川、崇礼门、首尔站、N 首尔塔、兴仁之门、DDP、首尔林、乐天世界塔、乐天世界魔幻岛（石村湖岛上）、奥林匹克公园和平之门、蚕室奥林匹克主体育场、COEX、江南站、盘浦大桥月光彩虹喷泉、龙山、汝矣岛 63 大厦、首尔世界杯体育场、金浦机场。\n\n建模要点：\n- 乐天世界塔：超椭圆截面锥形放样，顶部是开放钢构冠顶。\n- N 首尔塔：落在南山山顶，塔身夜间循环变色。\n- 63 大厦：金色梯形挤出。\n- DDP：曲线轮廓挤出并大倒角，表面有 LED 点阵。\n- 城门：石台加拱门，上面是重檐门楼；兴仁之门另加半圆瓮城。\n- 景福宫：宫墙、光化门、兴礼门、勤政殿（重檐加回廊）、思政殿等殿阁、庆会楼与池、香远亭、若干院落。韩式屋顶用 10 个三角面拼出四角起翘。\n- 两座体育场用 Lathe 旋转体。\n- 喷泉：只在桥体跨水段沿两侧布置喷嘴，GPU 粒子做抛物线，夜间呈彩虹色，叠加混合。\n- 金浦：3 架飞机沿 136° 跑道方向循环进近和起飞，夜间有航行灯。\n- 超高层楼顶有闪烁的红色航空障碍灯。\n\n每个地标配一张卡片：中文名、韩文与英文名、一段说明、三项数据、坐标，以及巡游镜头参数（距离、俯角、方位）。\n\n## 五、交互与 UI\n- **OrbitControls**：拖动旋转，右键或双指平移，滚轮缩放并朝向光标，俯角上限 82°。键盘支持方向键平移、+/- 缩放、H 回全景、T 开始巡游、N 切换昼夜。\n- **飞行**：目标点、方位、俯角做插值；距离在对数空间插值，中途按行程抬高形成弧线；缓动用三次 ease。\n- **巡游**：依次飞过 22 站，每站停留 7.5 秒并缓慢环绕，同步更新卡片和进度条；任何手动操作都会暂停巡游。\n- **标签**：地标标签为编号胶囊、引线和圆点，可点击；区名、山峰、桥梁、河流标签按距离淡入淡出；地标标签按优先级做屏幕空间碰撞避让。\n- **面板**：左侧是品牌、统计和地标列表；右侧是时间（滑杆、流动按钮、清晨/正午/黄昏/夜晚预设）、季节、天气和图层开关（区界、地名、车流、树木、建筑、移轴）；左下是可点击的小地图，显示视锥投影、当前区名和坐标；底部 dock 有全景、巡游、指北。\n- **区域**：鼠标悬停时显示区名、面积和海拔（通过高度场步进拾取），区界光幕随之升高；点击区域飞过去。\n- **载入**：载入页显示进度条；开场从高空俯冲到全景。默认时间 17:15，季节为秋。\n- **视觉风格**：深色半透明磨砂面板，金橙色主色（#f2b35e），青色辅色（#74c7cf），不使用网络字体。",
    promptEn: "# One-shot generation prompt\n\n> You are a front-end engineer who also does GIS data engineering and real-time graphics. Build a web page called **\"Seoul 3D Atlas\"**: a miniature Seoul diorama you can rotate and zoom. The data must be real, it should look like a tabletop model, and it should include a guided landmark fly-through and continuous day-night lighting. The deliverable is a directory that needs no build step and can be hosted statically as is.\n\n## 1. Delivery and constraints\n- Directory structure: `index.html`, `css/style.css`, `js/{main,geo,landmarks}.js`, `data/*`, `vendor/three/*`.\n- Relative paths only, no CDN. Get three.js r170 via `npm pack three@0.170.0` and copy it into `vendor/three/` (`three.module.min.js`, plus OrbitControls, EffectComposer, RenderPass, ShaderPass, UnrealBloomPass, OutputPass and their dependencies from addons), mapping `three` and `three/addons/` with an importmap.\n- The whole interface in Chinese, with place names also given in Korean. A thin 36px top bar at the top of the page: `← Three-way comparison` on the left, the work's name plus a small tag in the middle, and a link to the original on the right.\n- No horizontal overflow at 390px phone width; panels become bottom drawers.\n\n## 2. Offline data pipeline (Python: pyarrow, shapely, numpy, Pillow, scipy)\n1. **Extent and projection**: an equidistant projection centered on Seoul City Hall (126.978E, 37.5665N), 1 unit = 1 km, x east, z south. Diorama extent x∈[-21.8, 21.8], z∈[-18.6, 18.9].\n2. **Fetching data**: read Overture Maps GeoParquet on S3 (`overturemaps-us-west-2/release/<latest>/theme=*/type=*`). Read each file's footer first, filter by row-group bbox statistics, then use HTTP Range requests to fetch only the intersecting row groups. Layers needed: buildings/building, transportation/segment (including the is_bridge / is_tunnel ranges in road_flags), base/water, base/land_use, base/land_cover, base/land, divisions/division_area (Seoul's 25 counties).\n3. **Terrain**: AWS Terrain Tiles in Terrarium format at z12, resampled onto a 728×626 grid (int16, units of 0.1 m). Within the water mask, push terrain below water level (3 m); keep land at no less than 5.5 m; flatten the broad Han River, and carve tributaries down to their neighborhood minimum.\n4. **Buildings**: drop buildings under 60 m² and underground ones, as well as any in water or inside landmark reserve zones. Take the minimum rotated bounding rectangle and scale it down by the area ratio. Height comes from height first, then num_floors×3.3+2; when both are missing, estimate by rule: slab blocks inside residential land use with an aspect ratio ≥1.9 and a short side of 9–24 m are apartments, 36–70 m tall; small houses 5–9 m; large commercial volumes 18–42 m; schools and factories kept low. Type codes: detached house, mid-rise, apartment, glass tower, industrial, public, hanok (around the palaces); the highest bit marks \"outside Seoul city limits\". Store 14 bytes per building: x and z each quantized as uint16; width, depth, height and base elevation each uint16 (units of 0.1 m); angle uint8; type uint8. Sort everything by volume, descending.\n5. **Baked textures (4096×3524)**:\n   - `ground.jpg`: land-cover and land-use coloring, desaturated outside the city limits; secondary roads and railways drawn as thin lines; every building footprint drawn as a roof-colored block with a ring of blurred contact shadow; water filled with riverbed color.\n   - `night.jpg`: roads drawn as warm orange light lines by class, overlaid with blurred bloom, plus a glow weighted by building density; dimmed outside the city limits, black over water.\n   - `water.png` (water mask, slightly blurred); `mask.png` (R = water, G = green space, B = inside Seoul city limits).\n6. **meta.json**: major roads (motorways, expressways, primary, secondary) as polylines densified every 40 m, each point flagged (0 normal, 1 bridge, 2 tunnel) and clipped to the diorama extent; polygons for the 25 districts (simplified to 25 m) with a representative point and area; the Seoul city boundary.\n7. **trees.bin**: scatter 70,000 trees probabilistically within forest, park, cemetery, golf and similar masks, storing x, z, size and type for each.\n\n## 3. Rendering\n- **Terrain**: an indexed grid with normals from central differences. Use MeshStandardMaterial, injecting the following via `onBeforeCompile`:\n  - Per-pixel water detection from `water.png`: water color changes over time, roughness 0.16, normals perturbed by three sets of sine ripples (faded out in the distance using `fwidth`), and a Fresnel term reflecting the sky color;\n  - Night emission = `pow(night.jpg, 2.3) × night factor × a factor that falls off with camera distance`; water samples the light map with a mip bias of 5 as a blurred reflection;\n  - Seasonal color multiplied over the green-space mask; white cover when snowing, overall darkening and lower roughness when raining.\n- **Diorama**: the four side walls sample the terrain edge and carry a soil-strata texture; underneath, a dark wooden base with brass trim and a nameplate on the south side.\n- **Buildings**: 12×10 chunks, one InstancedMesh each (a unit box without a bottom face, base at y=0), with instance attribute `aInfo = (width, exaggerated height, depth, type)`. Within each chunk, sort descending by `max(width, depth, height×1.6)`; each frame compute the minimum visible size `1.3px × distance / focal length`, binary-search it and set `mesh.count`. Fragment shader:\n  - Pick wall and roof colors by type and hash, with about 40% of roofs painted with green waterproofing;\n  - Divide windows by floor height × window width, anti-aliased with `fwidth`; fade to the average when a window is smaller than a pixel;\n  - Darken the base of walls with AO;\n  - At night, light windows by hash and occupancy rate, mixing warm and cool white; in the distance, drop to 25% and unify to warm; add light bands atop glass towers.\n- **Bridges**: generate geometry only for bridge segments. Deck height interpolates between the approach heights at both ends with a slight camber, guaranteeing clearance above the water; sides carry night light strips; place a pier every 3 points over water.\n- **Traffic**: 14,000 Points driving on the right along the major-road polylines, with time scaled. By day, varied body colors; at night, white headlights in one direction and red taillights in the other (HDR values that feed the bloom).\n- **Sky**: a sky-dome shader interpolating between 7 keyframes by sun elevation; includes the sun disc and halo, horizon glow, stars (hashed, twinkling) and the moon.\n- **Lighting**: sun direction computed from Seoul's latitude and the declination formula; when the sun is below -2°, the key light switches to moonlight. The shadow camera follows the viewpoint every frame, radius = camera distance × 0.75, snapped to texels.\n- **Post-processing**: HalfFloat + 4×MSAA RenderTarget → UnrealBloom (stronger at night) → two-pass separable tilt-shift blur (strength varies with pitch) → vignette and saturation → OutputPass (ACES).\n- **Adaptive quality**: below 28 fps, lower the pixel ratio and raise the LOD threshold; above 55, bring them back up.\n\n## 4. Landmarks (22, modeled procedurally, with real coordinates)\nBaegundae Peak on Bukhansan, Gyeongbokgung Palace, Changdeokgung Palace, Gwanghwamun Square, Cheonggyecheon, Sungnyemun, Seoul Station, N Seoul Tower, Heunginjimun, DDP, Seoul Forest, Lotte World Tower, Lotte World Magic Island (on Seokchon Lake), Olympic Park's World Peace Gate, Jamsil Olympic Stadium, COEX, Gangnam Station, the Banpo Bridge Moonlight Rainbow Fountain, Yongsan, the 63 Building on Yeouido, Seoul World Cup Stadium and Gimpo Airport.\n\nModeling notes:\n- Lotte World Tower: a tapered loft with a superellipse cross-section, topped by an open steel-frame crown.\n- N Seoul Tower: sits on the summit of Namsan, its shaft cycling through colors at night.\n- 63 Building: a golden trapezoidal extrusion.\n- DDP: a curved-outline extrusion with large bevels and an LED dot matrix on its surface.\n- City gates: a stone base with an arched opening, topped by a double-eaved gate pavilion; Heunginjimun also gets a semicircular ongseong enclosure.\n- Gyeongbokgung: palace walls, Gwanghwamun, Heungnyemun, Geunjeongjeon (double eaves with cloisters), Sajeongjeon and other halls, Gyeonghoeru and its pond, Hyangwonjeong, and several courtyards. Korean roofs are built from 10 triangles to get the upturned corners.\n- The two stadiums are Lathe solids.\n- Fountain: nozzles placed along both sides only on the bridge's over-water span; GPU particles follow parabolas, rainbow-colored at night, with additive blending.\n- Gimpo: 3 aircraft loop through approaches and takeoffs along the 136° runway heading, with navigation lights at night.\n- Supertall rooftops have blinking red aviation obstruction lights.\n\nEach landmark gets a card: Chinese name, Korean and English names, a description, three stats, coordinates, and tour camera parameters (distance, pitch, azimuth).\n\n## 5. Interaction and UI\n- **OrbitControls**: drag to rotate, right-drag or two-finger pan, wheel zoom toward the cursor, pitch capped at 82°. Keyboard: arrow keys pan, +/- zoom, H returns to overview, T starts the tour, N toggles day/night.\n- **Flights**: interpolate target, azimuth and pitch; interpolate distance in log space, lifting mid-flight in proportion to the trip for an arc; cubic easing.\n- **Tour**: fly through all 22 stops in order, lingering 7.5 seconds at each with a slow orbit, updating the card and progress bar in sync; any manual input pauses the tour.\n- **Labels**: landmark labels are numbered pills with leader lines and dots, clickable; district, peak, bridge and river labels fade in and out by distance; landmark labels avoid each other in screen space by priority.\n- **Panels**: left — brand, stats and landmark list; right — time (slider, flow button, dawn/noon/dusk/night presets), season, weather and layer toggles (district borders, place names, traffic, trees, buildings, tilt-shift); bottom left — a clickable minimap showing the view-frustum footprint, current district name and coordinates; bottom dock — overview, tour, north-up.\n- **Districts**: on hover, show the district name, area and elevation (picked by marching the height field), and raise a light curtain along its border; click a district to fly there.\n- **Loading**: a loading screen with a progress bar; the opening swoops down from high altitude to the overview. Default time 17:15, season autumn.\n- **Visual style**: dark translucent frosted panels, golden orange primary (#f2b35e), cyan secondary (#74c7cf), no web fonts.",

    prompt: "# 一次性生成本作品的 Prompt\n\n> 你是一名图形程序员兼美术指导。请用 Three.js（r18x，ES Module + importmap，本地 `vendor/three/three.module.js` 和 `three.core.js`，不用 CDN，不用构建工具）做一个单页网页作品：**《走进梵高的小镇》**，把梵高的六幅画重新想象成一座可以第一人称步行穿越、处处都像油画笔触的 3D 小镇。界面文字全部用中文。\n>\n> ## 一、六幅画与小镇地理（必须是一座连通的镇，不是六个展厅）\n> 使用坐标 x 向东、z 向南、y 向上，单位米。\n> 1. **夜间露天咖啡座**（1888）：镇中心一条南北向的石板主街。西侧是咖啡馆：黄色墙面，一楼灯火通明，外挑一个向下倾斜的巨大黄色雨篷，雨篷下是橙黄色露台、圆桌和椅子，墙上挂一盏带巨大光晕的灯。东侧是蓝紫色的夜间楼房，窗子亮着灯。街道尽头是一座尖塔教堂。\n> 2. **黄房子（街道）**（1888）：东北方向的拉马丁广场。广场是沙土地面；黄房子是两层的转角楼，配绿色百叶窗和门。左邻是一栋粉色餐馆，挂着条纹雨篷。右边一条街向北，从石砌铁路高架桥下穿过（高架桥一直延伸到河上）。\n> 3. **阿尔勒的卧室**（1888）：就在黄房子里面，要能从正门真正走进去。房间是梯形的（一面墙是斜的），墙面淡紫蓝，地板是带绿色笔触的红褐色，黄色木床配大红被和柠檬色枕头，两把草编椅，窗边小桌上放着蓝色水壶，蓝色门，墙上挂几幅小画、一面镜子和一条毛巾。\n> 4. **罗纳河上的星夜**（1888）：镇东的河岸。近岸是缓坡草地（带粉紫色笔触），停着两三条小船，站着一对散步的男女。对岸是一排剪影楼房，窗户亮着灯；岸边一列煤气灯，灯光在水面上拉出黄橙色的倒影柱。天上有北斗七星。\n> 5. **麦田群鸦**（1890）：镇西的麦田。从一个路口分出三条红土小路（左、中、右），路边有绿色草缘。麦子用数万根金黄和赭色的笔触精灵表现，随风摆动。天空深蓝、翻涌，有两团被拉长的白云，二三十只乌鸦在盘旋振翅。\n> 6. **星月夜**（1889）：镇西南的一座小山。山顶有一棵高约 17 米的火焰形柏树（由数千笔墨绿、橄榄、棕黑的笔触组成）。从山顶往东北能俯瞰整座小镇、教堂尖塔和远处蓝色的阿尔皮耶山；天空里有巨大的双涡旋、带同心光环的星星和一弯橙色月牙。\n> 地形：镇区平整；麦田有轻微起伏；外围一圈山把地平线封起来，西侧较低，北侧是山脉。世界边界是一个圆，河道不可涉水。所有建筑都有碰撞。镇里填充程序化生成的街区楼房（奶油、赭、鲑粉、淡蓝、淡紫墙面，红陶坡顶，彩色百叶窗，夜里约四成窗户亮灯），加上街灯、广场树和行人。\n>\n> ## 二、画风：必须像画出来的，而不是加滤镜\n> 1. **世界空间的逐像素程序化笔触**。写一个 `ShaderMaterial` 给所有静态几何用。\n>    - 按法线主轴做三平面投影，得到平面坐标，再按\"单元大小\"切成网格，每格拥有一笔。每一笔有随机偏移、长度（0.6–1.0 格半长）、宽度（长度 / 长宽比）、角度（基础角 + 抖动 + 可选噪声流场），宽度沿长度收窄，形状是圆头胶囊。\n>    - 用两层交错的网格，在 3×3 邻域里找出优先级最高的覆盖笔（最上层），同时记下第二名。\n>    - **光照在笔触中心的世界坐标上算**，所以光斑会被量化成一块块纯色的笔触。\n>    - 每一笔：颜色从 3 色调色板里按哈希选取并抖动；加上隆起高光、鬃毛纹、起笔厚收笔薄；可选深色描边（用于石板路）。笔触抗锯齿的边缘混到第二名那一笔上，不要混到深色缝隙里。\n> 2. **两级 LOD**：笔触格子在屏幕上小于约 4 像素时，淡出到 4 倍大的粗笔触层，再往远才淡出到平均色。LOD 用两个方向导数的几何平均来判断，这样掠射角的地面不会过早变平。\n> 3. **每个顶点带调色板和笔触参数**（3 个颜色、单元大小、长宽比、角度、抖动、自发光、流场、描边、尺寸）。所有建筑合并成一个网格，一次绘制。\n> 4. **夜色调**：夜间只对环境光那部分做色相推移（推向蓝、紫、绿），灯光照到的部分保持暖色。这是一幅\"没有黑色的夜景\"。灯光衰减要陡，免得街对面也被照成橙色。\n> 5. **天空**：\n>    - 先把颜色场和方向场渲染到等距柱状 RT 上（颜色 1024×512，方向 512×256；方向用倍角向量存储，才能做轴向混合）。颜色场包括渐变、横向波纹色带、多个带螺旋色带的涡旋、星星的同心光环、月牙、麦田的云；方向场是水平流加上涡旋、星星、月亮周围的切向流。\n>    - 天球着色器按纬度分行、每行的格子数随 cos(纬度) 变化，经度取模闭合接缝。每一笔取中心点的颜色、方向场的角度。星核和月牙另外用解析方式叠加，星核轻微闪烁。\n> 6. **精灵笔触**：麦子、草、柏树、树冠、行人都是实例化的柱状公告板笔触，锥形胶囊加鬃毛纹，带风摆，逐实例计算光照。行人由十几笔拼成：腿、外套、手臂、头、帽檐。煤气灯的光晕是分段的同心弧笔触，由内向外是白、黄、橙、黄绿。乌鸦是振翅的 M 形笔。\n> 7. **水面**：同样铺笔触（长的横向笔，深度方向拉伸 2.2 倍）。每一笔的颜色 = 深蓝 + 天空颜色场的反射 + 按\"相机到灯的方位角对齐\"计算的煤气灯倒影柱。相机升高时倒影逐渐消失。\n> 8. **后期**：\n>    - 对齐到纹素中心采样深度，用深度拉普拉斯和跳变画普鲁士蓝的手绘轮廓。颜色采样另加轻微抖动。\n>    - 饱和度约 1.14，画布经纬纹理加颗粒，轻微暗角。\n>\n> ## 三、\"走进哪幅画，就变成哪幅画\"\n> 每幅画有一个中心和内外半径（卧室用房间的包围盒）。按相机位置混合一组氛围参数：夜晚程度、天顶色、地平色、涡旋强度、星星、月亮、北斗、云、乱流、太阳方向和颜色、天光、地光、雾、灯光强度、底色。随时间平滑插值。\n> - 咖啡座、罗纳河、星月夜是夜；黄房子和卧室是钴蓝天空下的白天；麦田是阴沉翻涌的白天。\n> - 每次只把最近的 8 盏灯传进着色器。\n>\n> ## 四、交互与界面\n> - WASD 或方向键行走，Shift 快走，Q/E 转身。鼠标拖动看四周，单击锁定指针。手机上左半屏是虚拟摇杆，右半屏拖动看四周。碰撞用线段加圆，轻微的走路起伏。\n> - 每幅画有一个\"画家视点\"（位置加注视点加 FOV），视点旁边立一个画架，画布上是这幅画的调色板。\n>   - 数字键 1–6 或底部 6 个色卡按钮：从空中飞越屋顶到画架前。飞行中先朝飞行方向看，落地时对准原作构图。进出卧室要先经过门口。\n> - T 键自动导览（每站停 7.5 秒，任何输入都会打断）。F 键画框模式：按当前这幅画的真实宽高比，在画面上压一个金色画框和铭牌，框外压暗。H 键隐藏界面，M 键开关环境声（WebAudio 合成：风、河水、蟋蟀、咖啡馆人声，按区域混音）。\n> - 进入一个区域时，左下角出现米色的博物馆标签：中文名、原名、年份、地点和收藏馆，外加一句梵高书信的中文引文。几秒后自动隐藏。右上角有圆形小地图。\n> - 开场\"小镇自己画出来\"：先是米色画布，然后在约 3.4 秒内一笔一笔落下（笔触按哈希阈值逐步显现，精灵和光晕也一样）。开场界面叠在画面左侧：大标题「走进梵高的小镇」、一段说明、「开始漫步」和「跟随导览」两个按钮、按键说明。背景镜头缓慢漂移。\n> - 页面顶部是一条 34px 的细顶栏：左边「← 三方对照」链接到 `../../compare/index.html`，中间是作品名和一个小标签「Opus 5.5 · 独立逆向」，右边「原作 @petergostev ↗」链接到原帖。在 390px 宽的屏幕上不能横向溢出。\n> - 性能：检测到软件渲染或手机时降低精灵数量；按帧时间自适应调整内部渲染分辨率（0.45–1.5）。提供调试参数 `?vp=<id>`、`?t=<秒>`、`?scale=`、`?q=`、`?frames=N`（渲染 N 帧后停下，供截图用）、`?cover`（隐藏全部界面）。\n>\n> ## 五、交付\n> `index.html`、`js/*.js`、`vendor/three/`，只用相对路径，能被静态托管。控制台不能有任何报错。",
    promptEn: "# One-shot prompt for this work\n\n> You are a graphics programmer and art director. Using Three.js (r18x, ES Modules + importmap, with local `vendor/three/three.module.js` and `three.core.js`, no CDN, no build tools), build a single-page web piece: **\"Walk Into Van Gogh's Village\"** — reimagining six of Van Gogh's paintings as a 3D village you can cross on foot in first person, where everything looks like oil-paint brushstrokes. All interface text in Chinese.\n>\n> ## 1. Six paintings and the village's geography (it must be one connected village, not six galleries)\n> Coordinates: x east, z south, y up, in meters.\n> 1. **Café Terrace at Night** (1888): a north-south flagstone main street in the village center. The café is on the west side: yellow walls, a brightly lit ground floor, a huge yellow awning sloping outward and down, beneath it an orange-yellow terrace with round tables and chairs, and a wall lamp with an enormous halo. On the east side are blue-violet night buildings with lit windows. At the end of the street is a church with a spire.\n> 2. **The Yellow House (The Street)** (1888): Place Lamartine to the northeast. The square has a sandy ground; the Yellow House is a two-story corner building with green shutters and door. Next door on the left is a pink restaurant with a striped awning. On the right, a street heads north and passes under a stone railway viaduct (which extends all the way over the river).\n> 3. **Bedroom in Arles** (1888): inside the Yellow House, and you must be able to actually walk in through the front door. The room is trapezoidal (one wall is slanted), with pale violet-blue walls, a reddish-brown floor with green strokes, a yellow wooden bed with a scarlet blanket and lemon pillows, two rush-seated chairs, a blue jug on a small table by the window, a blue door, and a few small paintings, a mirror and a towel on the walls.\n> 4. **Starry Night Over the Rhône** (1888): the riverbank east of the village. The near bank is a gently sloping meadow (with pink-violet strokes), with two or three small boats moored and a couple out for a stroll. On the far bank, a row of silhouetted buildings with lit windows; along the bank a line of gas lamps whose light stretches into yellow-orange reflection columns on the water. The Big Dipper is in the sky.\n> 5. **Wheatfield with Crows** (1890): the wheat fields west of the village. Three red-earth paths (left, center, right) branch from a junction, with green grassy verges. The wheat is tens of thousands of golden and ochre stroke sprites swaying in the wind. The sky is deep blue and turbulent, with two stretched white clouds, and twenty or thirty crows circling and flapping.\n> 6. **The Starry Night** (1889): a small hill southwest of the village. On the summit stands a flame-shaped cypress about 17 m tall (made of thousands of dark green, olive and brown-black strokes). From the summit, looking northeast, you overlook the whole village, the church spire and the distant blue Alpilles; the sky holds giant double swirls, stars with concentric halos and an orange crescent moon.\n> Terrain: the village is flat; the wheat fields undulate slightly; a ring of hills closes off the horizon, lower on the west, with a mountain range to the north. The world boundary is a circle, and the river cannot be waded. Every building has collision. Fill the village with procedurally generated blocks of houses (cream, ochre, salmon-pink, pale blue and pale violet walls, terracotta pitched roofs, colored shutters, about 40% of windows lit at night), plus street lamps, square trees and pedestrians.\n>\n> ## 2. Painting style: it must look painted, not filtered\n> 1. **Per-pixel procedural brushstrokes in world space.** Write a `ShaderMaterial` used for all static geometry.\n>    - Triplanar-project by the normal's dominant axis to get planar coordinates, then cut them into a grid by \"cell size\", each cell owning one stroke. Each stroke has a random offset, length (half-length of 0.6–1.0 cells), width (length / aspect ratio) and angle (base angle + jitter + an optional noise flow field); width tapers along the length, and the shape is a round-ended capsule.\n>    - Use two interleaved grid layers, and within the 3×3 neighborhood find the highest-priority covering stroke (topmost), also recording the runner-up.\n>    - **Compute lighting at the world position of the stroke's center**, so highlights are quantized into solid-colored strokes.\n>    - Each stroke: color picked by hash from a 3-color palette and jittered; plus a ridge highlight, bristle texture, thick start and thin end; optional dark outline (for flagstones). The anti-aliased edge of a stroke blends into the runner-up stroke, not into a dark gap.\n> 2. **Two-level LOD**: when stroke cells are smaller than about 4 pixels on screen, fade to a coarse stroke layer 4× larger, and only farther out fade to the average color. Decide LOD using the geometric mean of the two directional derivatives so grazing-angle ground doesn't flatten too early.\n> 3. **Every vertex carries palette and stroke parameters** (3 colors, cell size, aspect ratio, angle, jitter, emission, flow field, outline, size). All buildings are merged into one mesh and drawn in a single call.\n> 4. **Night tint**: at night, hue-shift only the ambient-light part (toward blue, violet, green), keeping lamp-lit areas warm. This is a \"night scene without black\". Lamp falloff should be steep so the far side of the street isn't lit orange too.\n> 5. **Sky**:\n>    - First render a color field and a direction field to equirectangular RTs (color 1024×512, direction 512×256; store direction as a double-angle vector so it can be blended axially). The color field includes gradients, horizontal rippling color bands, several swirls with spiral bands, concentric star halos, the crescent moon and the wheat-field clouds; the direction field is horizontal flow plus tangential flow around the swirls, stars and moon.\n>    - The sky-dome shader splits rows by latitude, with the number of cells per row varying with cos(latitude) and longitude wrapped modulo to close the seam. Each stroke takes the color at its center point and its angle from the direction field. Star cores and the crescent are overlaid analytically, with the star cores twinkling slightly.\n> 6. **Sprite strokes**: wheat, grass, cypresses, tree canopies and pedestrians are instanced cylindrical-billboard strokes — tapered capsules with bristle texture, swaying in the wind, lit per instance. Pedestrians are assembled from a dozen or so strokes: legs, coat, arms, head, hat brim. Gas-lamp halos are segmented concentric arc strokes, white, yellow, orange and yellow-green from inside out. Crows are flapping M-shaped strokes.\n> 7. **Water**: also covered in strokes (long horizontal strokes, stretched 2.2× in depth). Each stroke's color = deep blue + reflection of the sky color field + gas-lamp reflection columns computed by \"aligning with the camera-to-lamp azimuth\". The reflections gradually vanish as the camera rises.\n> 8. **Post-processing**:\n>    - Sample depth snapped to texel centers, and draw hand-drawn Prussian blue outlines from the depth Laplacian and discontinuities. Add a slight jitter to color sampling as well.\n>    - Saturation about 1.14, canvas weave texture plus grain, a light vignette.\n>\n> ## 3. \"Walk into a painting, and the world becomes that painting\"\n> Each painting has a center and inner/outer radii (the bedroom uses the room's bounding box). Blend a set of atmosphere parameters by camera position: night amount, zenith color, horizon color, swirl strength, stars, moon, Big Dipper, clouds, turbulence, sun direction and color, sky light, ground light, fog, lamp intensity, base color. Interpolate smoothly over time.\n> - The café terrace, the Rhône and The Starry Night are night; the Yellow House and the bedroom are daytime under a cobalt sky; the wheat field is a gloomy, turbulent day.\n> - Pass only the nearest 8 lamps into the shader at any time.\n>\n> ## 4. Interaction and interface\n> - Walk with WASD or the arrow keys, Shift to walk faster, Q/E to turn. Drag the mouse to look around, click to lock the pointer. On phones, the left half of the screen is a virtual joystick and dragging on the right half looks around. Collision uses segments plus circles, with a slight walking bob.\n> - Each painting has a \"painter's viewpoint\" (position + look-at + FOV), with an easel standing beside it whose canvas shows that painting's palette.\n>   - Number keys 1–6 or the 6 color-swatch buttons at the bottom: fly over the rooftops to the easel. During the flight, look along the direction of travel first, then settle on the original composition on landing. Entering or leaving the bedroom must pass through the doorway.\n> - T for an automatic tour (7.5 seconds per stop, interrupted by any input). F for frame mode: overlay a gold frame and nameplate at the current painting's true aspect ratio, darkening outside the frame. H hides the UI, M toggles ambient sound (WebAudio synthesis: wind, river, crickets, café chatter, mixed by zone).\n> - On entering a zone, a beige museum label appears at the bottom left: Chinese name, original title, year, place and collection, plus a Chinese quotation from Van Gogh's letters. It hides automatically after a few seconds. A round minimap sits at the top right.\n> - Opening: \"the village paints itself\" — first a beige canvas, then strokes land one by one over about 3.4 seconds (strokes appear progressively by a hash threshold, sprites and halos too). The opening screen overlays the left side of the view: the large title \"走进梵高的小镇\" (Walk Into Van Gogh's Village), a paragraph of description, two buttons \"Start walking\" and \"Follow the tour\", and key instructions. The background camera drifts slowly.\n> - A thin 34px top bar at the top of the page: \"← Three-way comparison\" on the left, linking to `../../compare/index.html`; the work's name and a small tag \"Opus 5.5 · Solo rebuild\" in the middle; \"Original @petergostev ↗\" on the right, linking to the original post. No horizontal overflow on a 390px-wide screen.\n> - Performance: reduce sprite counts when software rendering or a phone is detected; adapt internal render resolution (0.45–1.5) to frame time. Provide debug parameters `?vp=<id>`, `?t=<seconds>`, `?scale=`, `?q=`, `?frames=N` (stop after rendering N frames, for screenshots) and `?cover` (hide all UI).\n>\n> ## 5. Delivery\n> `index.html`, `js/*.js`, `vendor/three/`, relative paths only, statically hostable. There must be no errors in the console.",
