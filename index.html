    prompt: "# 一次性生成 Prompt：轨道能量核心（Orbital Core）\n\n> 用途：让一个代码模型在一次回复里生成本作品的完整静态站点。\n\n---\n\n请用 **Three.js（r181，ES Module + importmap，本地 `vendor/` 目录，不用 CDN、不用构建工具）** 做一个单页 3D 产品展示网页，主角是一件「双环能量核心」。目标是：看起来像一件在 Blender 里精细建模、用 Cycles/Eevee 渲过的硬表面产品，而不是一个球加两个甜甜圈。界面文字全部用中文。\n\n## 文件结构\n```\nindex.html        入口（importmap: \"three\" → ./vendor/three/three.module.min.js，\"three/addons/\" → ./vendor/three/addons/）\ncss/style.css\njs/model.js       程序化建模：导出 buildOrbitalCore() → { root, parts, uniforms, materials }\njs/main.js        渲染器、环境光照、后期、相机、交互、模式状态机、UI 联动\njs/audio.js       WebAudio 合成的核心嗡鸣\nvendor/           three.module.min.js + three.core.min.js + OrbitControls / EffectComposer / RenderPass / UnrealBloomPass / OutputPass / ShaderPass 及其依赖；字体 woff2\n```\n\n## 模型（全部程序化，不加载外部模型）\n写一个 `sweepProfile(profile, {phi0, phi1, steps, closed, caps})`：把二维截面 `[(r, y)…]` 绕 Y 轴扫掠（等同 Blender 的 Spin/Screw 修改器）。**每条截面边单独生成一条带状面、拥有自己的法线**，这样倒角面会成为清晰的高光线；可选在 phi0/phi1 处用 `ShapeUtils.triangulateShape` 封端；按顶点法线自动修正三角形绕序。UV 的 u 沿圆周方向，便于做「车削金属」拉丝。\n\n1. **等离子核心**：半径 0.5 的球，ShaderMaterial，3D simplex 噪声 + 域扭曲 fbm 生成对流胞，再叠 `pow(1-|noise|, 9)` 的亮丝；深蓝→钴蓝→白热三段色，输出 HDR（>1）供辉光使用；边缘加一点日冕亮边。外面套两层 BackSide 加法混合的菲涅耳光晕球（0.86、1.35）。\n2. **测地约束笼**：`IcosahedronGeometry(0.66, 1)` 去重顶点、提取 120 条边 → InstancedMesh 细圆柱支杆 + 42 个八面体钛合金节点 + 12 个五度顶点上的小 LED。整个笼缓慢自转。\n3. **陀螺架双环（重点）**：外环 R=1.42 竖直、随万向架绕 Y 转（方位 α）；内环 R=1.16 由两根阶梯钛销挂在外环 ±X 处，绕 X 轴翻转（俯仰 β）——是真正能转的万向节，而不是两个相交的圆环。每道环：\n   - 截面是带 0.014 倒角的矩形，外表面开一条凹槽；\n   - 环体切成 12/10 段，段间留 0.03 rad 缝，每段两端封口；\n   - 凹槽里有一条连续的发光导轨，环体中心有一条「脊」发光条，**只从切缝里透出来**，所以每条缝都是一道蓝光；\n   - 在 0°/90°/180°/270° 放加厚的钛合金卡箍，上面各有三颗 LED（两冷一暖琥珀色点缀）。\n   - 万向架整体再倾斜 ~0.2 rad，并带一点缓慢进动。\n4. **悬浮基座**：一条带台阶、倒角、环形凹槽的截面扫掠成整体；凹槽内发光环；中心是菲涅耳纹发射透镜（同心阶梯 shader）；台面上叠一张 Canvas 画的刻度盘（2° 细刻度、10°/30° 长刻度、环形微缩字 `ORBITAL CORE · SPECIMEN 01 …`、4 个三角索引），加法混合，随 α 慢转；侧面 72 片散热鳍（InstancedMesh）；台阶立面 24 条状态灯缝；从透镜到核心有一束带流动条纹的加法光柱。\n5. **地台**：大圆形暗色地面 + 放射渐变的「烘焙 AO」接触阴影贴片 + 一张加法混合的地面特效 shader（基座下的光池、每 1.45 单位一圈的虚线测量环、外圈细刻度、脉冲模式下的扩散冲击波）。\n\n## 材质与光照（「Blender 质感」的关键）\n- 程序化拉丝贴图：Canvas 上画几千条沿 u 方向的随机灰线 → 作为 roughnessMap；环体与基座用 `MeshPhysicalMaterial`，`metalness 1`，环体带 clearcoat，基座开 `anisotropy`，得到车削金属那种放射状高光。\n- 自己搭一个迷你「HDRI 棚」：在一个场景里放暗色渐变天球 + 顶部大柔光箱 + 左侧冷蓝灯条 + 右侧白灯条 + 背后地平线蓝光 + 一小块暖色反光板，用 `PMREMGenerator.fromScene` 烘成 `scene.environment`。\n- 核心内放一盏投射阴影的点光源（强度随能量变化），让环、笼的影子落到基座上；再加一盏冷白主光和一盏蓝色轮廓光。\n- 背景是一个与 FogExp2 同色的天穹 shader，地面在远处无缝溶进去，不能出现地平线硬边。\n- 后期：`EffectComposer`（HalfFloat、MSAA 4x 的 render target）→ `UnrealBloomPass`（强度 ~0.45、半径 0.4、阈值 0.95，只让 HDR 发光体溢光）→ `OutputPass`（ACES）→ 自定义 ShaderPass：边缘轻微色散 + 暗角 + 胶片颗粒抖动（顺便消除暗部色带）。\n\n## 交互与状态机\n- OrbitControls：阻尼、禁平移、限制俯仰不钻到地下；距离按视口宽高比自动计算（竖屏更远），用 `camera.setViewOffset` 在桌面把模型略微推向右侧给标题让位，手机上略微下移。\n- 开场：相机从远处低角度 3.4 秒缓入，核心在 0.35–2 秒间「点火」（按真实时间计，慢设备也能播完）；用户一拖动就立刻交出控制权。双击或按 R 平滑复位。\n- 四个模式（按钮 + 键盘 1–4）：\n  - **轨道**：α、β 慢转，相机自动环绕，核心轻微呼吸；\n  - **脉冲**：转速加快，能量按「咚-哒」双峰心跳包络跳动（1.25 s 周期），每一拍地面扩散一圈冲击波、声音里出一记低频 thump；\n  - **静止**：所有转速阻尼归零，核心待机微光，状态灯变琥珀色；\n  - **拆解**：万向架回正，外环抬到上方、内环落到下方并都转平，笼子放大，核心上浮，相机目标上移；出现 5 个带引线的 HTML 标注（等离子核心 / 测地约束笼 / 外环·方位环 / 内环·俯仰环 / 悬浮基座，附尺寸规格），锚点每帧投影，环类标注自动取屏幕上最外侧的点，标注在手机上夹紧在视口内。\n- 所有速度、能量、拆解进度都用指数阻尼平滑，切换模式没有跳变。\n- 自适应分辨率：帧率低于 30 时逐步把 pixelRatio 降到 1。\n\n## UI（叠在画布上）\n- 最顶部一条 34px 细顶栏：左「← 三方对照」、中「轨道能量核心」+ 小胶囊标签、右「原作 @作者 ↗」。\n- 左上品牌「ORBITAL / OBJECTS」+ 小轨道图标；右上「样本 01 / DUAL-RING CONTAINMENT」。\n- 左侧大标题（衬线体，第二行斜体渐变字）：「两道轨道 / 一颗恒星。」+ 一段短说明。\n- 右侧实时参数表：状态、核心频率（THz）、外环方位 α、内环俯仰 β、场强输出 %，底下是一条画出能量历史的小示波器。\n- 左下四个模式按钮（带小图形符号和键位提示），页脚操作提示 + 声音开关（WebAudio：两支微失谐锯齿波过共振低通 + 次低频正弦 + 高频微光颤音，滤波截止随能量和转速变化）。\n- 背景加 76px 细网格（遮罩渐隐）和 SVG 噪点颗粒。\n- ≤740px：标题移到上方、隐藏说明段，参数表变成三列横条，四个按钮平分一行；390px 宽不能横向溢出。\n- 字体：Instrument Serif（标题）+ IBM Plex Mono（数据），woff2 放 vendor，中文回退到系统宋体/黑体。\n\n## 质量要求\n- 控制台零报错；WebGL 创建失败时显示中文提示。\n- 所有发光色用 HDR 值，靠辉光而不是把漫反射调亮来「发光」。\n- 暗部要深（钴蓝-近黑），不要整体泛白发灰。",
    promptEn: "# One-shot generation prompt: Orbital Core\n\n> Purpose: have a code model generate this work's complete static site in a single reply.\n\n---\n\nUsing **Three.js (r181, ES Modules + importmap, a local `vendor/` directory, no CDN, no build tools)**, build a single-page 3D product showcase whose hero is a \"dual-ring energy core\". The goal: it should look like a hard-surface product carefully modeled in Blender and rendered in Cycles/Eevee, not a sphere with two donuts. All interface text in Chinese.\n\n## File structure\n```\nindex.html        entry (importmap: \"three\" → ./vendor/three/three.module.min.js, \"three/addons/\" → ./vendor/three/addons/)\ncss/style.css\njs/model.js       procedural modeling: exports buildOrbitalCore() → { root, parts, uniforms, materials }\njs/main.js        renderer, environment lighting, post-processing, camera, interaction, mode state machine, UI bindings\njs/audio.js       WebAudio-synthesized core hum\nvendor/           three.module.min.js + three.core.min.js + OrbitControls / EffectComposer / RenderPass / UnrealBloomPass / OutputPass / ShaderPass and dependencies; woff2 fonts\n```\n\n## Model (all procedural; no external models loaded)\nWrite a `sweepProfile(profile, {phi0, phi1, steps, closed, caps})` that sweeps a 2D profile `[(r, y)…]` around the Y axis (equivalent to Blender's Spin/Screw modifier). **Each profile edge generates its own strip with its own normals**, so bevel faces become crisp highlight lines; optionally cap at phi0/phi1 using `ShapeUtils.triangulateShape`; fix triangle winding automatically from vertex normals. The UV u runs around the circumference, for \"lathed metal\" brushing.\n\n1. **Plasma core**: a sphere of radius 0.5 with a ShaderMaterial — 3D simplex noise + domain-warped fbm for convection cells, overlaid with bright filaments from `pow(1-|noise|, 9)`; a three-stop deep blue → cobalt → white-hot ramp, output as HDR (>1) for bloom; a hint of coronal rim at the edge. Wrap it in two BackSide, additively blended Fresnel halo spheres (0.86, 1.35).\n2. **Geodesic containment cage**: `IcosahedronGeometry(0.66, 1)` with deduplicated vertices, extracting 120 edges → an InstancedMesh of thin cylindrical struts + 42 octahedral titanium nodes + 12 small LEDs on the five-valent vertices. The whole cage rotates slowly.\n3. **Gyroscopic dual rings (the key part)**: the outer ring, R=1.42, stands vertical and turns about Y with the gimbal (azimuth α); the inner ring, R=1.16, hangs from the outer ring at ±X on two stepped titanium pins and flips about the X axis (pitch β) — a real, working gimbal, not two intersecting tori. Each ring:\n   - Has a rectangular cross-section with 0.014 bevels and a groove cut into its outer face;\n   - Is split into 12/10 segments with 0.03 rad gaps between them, each segment capped at both ends;\n   - Has a continuous glowing rail in the groove and a glowing \"spine\" strip at the ring's center **that shows only through the gaps**, so every gap is a line of blue light;\n   - Gets thickened titanium clamps at 0°/90°/180°/270°, each with three LEDs (two cool, one warm amber accent).\n   - The whole gimbal is tilted by ~0.2 rad and precesses slowly.\n4. **Levitation base**: a single sweep of a profile with steps, bevels and a ring groove; a glowing ring inside the groove; at the center a Fresnel-patterned emitter lens (concentric stepped shader); on the top surface an additively blended Canvas-drawn dial (2° fine ticks, 10°/30° long ticks, a ring of micro text `ORBITAL CORE · SPECIMEN 01 …`, 4 triangular index marks) rotating slowly with α; 72 cooling fins around the side (InstancedMesh); 24 status-light slits on the step risers; and an additive light column with flowing stripes from the lens up to the core.\n5. **Floor**: a large dark circular floor + a radial-gradient \"baked AO\" contact-shadow decal + an additively blended floor-effects shader (a pool of light under the base, a dashed measuring ring every 1.45 units, fine ticks on the outer ring, and expanding shockwaves in pulse mode).\n\n## Materials and lighting (the key to the \"Blender look\")\n- Procedural brushed texture: draw thousands of random grey lines along u on a Canvas → use as the roughnessMap; rings and base use `MeshPhysicalMaterial` with `metalness 1`, clearcoat on the rings and `anisotropy` on the base, for the radial highlights of lathed metal.\n- Build your own mini \"HDRI studio\": in a separate scene place a dark gradient sky dome + a large softbox overhead + a cool blue light strip on the left + a white light strip on the right + a blue horizon glow behind + a small warm bounce card, and bake it into `scene.environment` with `PMREMGenerator.fromScene`.\n- Put a shadow-casting point light inside the core (intensity follows energy) so the rings and cage cast shadows onto the base; add a cool white key light and a blue rim light.\n- The background is a sky-dome shader in the same color as FogExp2, so the floor dissolves seamlessly into it in the distance with no hard horizon.\n- Post-processing: `EffectComposer` (HalfFloat, MSAA 4x render target) → `UnrealBloomPass` (strength ~0.45, radius 0.4, threshold 0.95, so only HDR emitters bloom) → `OutputPass` (ACES) → a custom ShaderPass: slight chromatic aberration at the edges + vignette + film-grain dither (which also removes banding in the shadows).\n\n## Interaction and state machine\n- OrbitControls: damped, pan disabled, pitch limited so the camera can't go below the floor; distance computed from the viewport aspect ratio (farther in portrait), with `camera.setViewOffset` nudging the model slightly right on desktop to make room for the title, and slightly down on phones.\n- Opening: the camera eases in from far away at a low angle over 3.4 seconds, and the core \"ignites\" between 0.35 and 2 seconds (timed in real time, so it completes even on slow devices); control is handed over the instant the user drags. Double-click or press R to reset smoothly.\n- Four modes (buttons + keys 1–4):\n  - **Orbit**: α and β turn slowly, the camera orbits automatically, the core breathes gently;\n  - **Pulse**: rotation speeds up and energy beats with a \"lub-dub\" double-peaked heartbeat envelope (1.25 s period); each beat sends a shockwave across the floor and a low-frequency thump through the sound;\n  - **Still**: all rotation damps to zero, the core idles with a faint glow, and the status lights turn amber;\n  - **Disassemble**: the gimbal levels out, the outer ring rises above and the inner ring drops below, both turning flat; the cage scales up, the core floats upward, and the camera target moves up; 5 HTML callouts with leader lines appear (plasma core / geodesic containment cage / outer ring · azimuth ring / inner ring · pitch ring / levitation base, with dimensions and specs), their anchors projected every frame; ring callouts automatically use the outermost point on screen, and callouts are clamped inside the viewport on phones.\n- All speeds, energy and disassembly progress are smoothed with exponential damping, so mode changes never jump.\n- Adaptive resolution: when frame rate drops below 30, step pixelRatio down to 1.\n\n## UI (overlaid on the canvas)\n- A thin 34px bar at the very top: left \"← Three-way comparison\", center \"Orbital Core\" + a small pill tag, right \"Original @author ↗\".\n- Top left, brand \"ORBITAL / OBJECTS\" + a small orbit icon; top right \"Specimen 01 / DUAL-RING CONTAINMENT\".\n- A large title on the left (serif, second line in italic gradient text): \"Two orbits / one star.\" + a short description.\n- A live readout table on the right: status, core frequency (THz), outer-ring azimuth α, inner-ring pitch β, field output %, with a small oscilloscope below plotting energy history.\n- Four mode buttons at the bottom left (with small glyphs and key hints), a footer with controls hint + sound toggle (WebAudio: two slightly detuned sawtooth waves through a resonant low-pass + a sub-bass sine + a high shimmering tremolo, with filter cutoff following energy and rotation speed).\n- A 76px fine grid in the background (masked fade) plus SVG noise grain.\n- ≤740px: the title moves to the top and the description is hidden, the readout table becomes a three-column strip, the four buttons share one row; no horizontal overflow at 390px width.\n- Fonts: Instrument Serif (titles) + IBM Plex Mono (data), woff2 files in vendor, with Chinese falling back to system Song/Hei typefaces.\n\n## Quality bar\n- Zero console errors; show a message in Chinese if WebGL creation fails.\n- All emissive colors use HDR values — they \"glow\" through bloom, not by brightening the diffuse.\n- Shadows should be deep (cobalt to near-black); the image should never look washed-out or grey overall.",

    prompt: "好，现在你看下这个开源项目[https://github.com/MartinDelophy/awesome-gpt-6-astra](https://github.com/MartinDelophy/awesome-gpt-6-astra)，我觉得里面的游戏还是太少了，也不够丰富，你现在帮我生成一款雷霆战机游戏（玩法要丰富，敌人子弹会有激光，子弹会漂移等等，击杀敌机有概率爆蓝色绿色紫色金色武器，会在屏幕内一直飘荡10s左右，开局可以选择3种战斗机，最少要有5关，通关时长要10分钟等等等等），就是手机也能玩，你知道吧？你可以github或小时候的游戏厅查一下这种比较丰富的玩法\n\n——原作者看过第一版后追加的反馈：\n战斗机建模有点拉胯，要更酷炫一点，我觉得你可以完全按照 雷电 来，就当是儿时记忆",
    promptEn: "OK, now take a look at this open-source project [https://github.com/MartinDelophy/awesome-gpt-6-astra](https://github.com/MartinDelophy/awesome-gpt-6-astra). I think there are still too few games in it, and they're not rich enough. Now help me make a \"Thunder Fighter\" game (the gameplay should be rich: enemy bullets include lasers, bullets drift, and so on; killing enemy planes has a chance to drop blue, green, purple and gold weapons that keep floating around the screen for about 10s; you can choose from 3 fighter planes at the start; at least 5 stages; a full run should take 10 minutes, etc., etc.), and it should be playable on phones too, you know? You can look up this kind of rich gameplay on GitHub or from the arcades we grew up with.\n\n— Follow-up feedback the original author added after seeing the first version:\nThe fighter models are kind of lame — make them way cooler. I think you can just go fully Raiden with it, like a childhood memory.",
    promptNote: "这是 Astra 原作者公开的原始 prompt，Opus 5.5 拿到的就是这段原文（另附同样的格式约束与「不准看原作」规则）。对决与盲评见对打页。",
    promptSource: "https://github.com/MartinDelophy/awesome-gpt-6-astra/tree/main/works/thunderfall"
  },
  // ==== 同题对打 END ====
  // 下一个网站：复制上面一段，改内容即可
];

const list = document.getElementById("list");
document.getElementById("year").textContent = new Date().getFullYear();

/* ── 语言 / Language ───────────────────────────────────────────── */
const LANG_KEY = "gallery-lang";
const I18N = {
  zh: {
    title: "Website Gallery — 网站画廊",
    metaDesc: "网站画廊：收藏可以亲自体验的网站，也留下制作它们的起点——每个案例附制作 Prompt，可直接阅读、复制，再打开成品对照探索。",
    toggle: "EN",
    count: n => n + " 个展览",
    heroTitle: "网站画廊",
    heroText: "收藏可以亲自体验的网站，也留下制作它们的起点。三个新案例附制作 Prompt，可在首页直接阅读、复制，再打开成品对照探索。",
    colNum: "编号", colEx: "展览", colLink: "入口",
    open: t => "打开" + t,
    badge: "成功案例 · 附制作 Prompt",
    defaultNote: "保留发起制作时的原始需求；成品经过后续实现、调试与浏览器验证。",
    copy: "复制 Prompt", copyAria: t => "复制" + t + "的 Prompt",
    copied: "已复制 ✓", copiedStatus: "已复制完整 Prompt",
    selectFallback: "已选中全文，请按 Ctrl+C / ⌘C 复制",
    source: "参考来源 ↗",
    tagLocal: "本地", tagIntl: "国际", tagChina: "中国", openWork: "打开作品", pending: "待发布",
    labels: {},
  },
  en: {
    title: "Website Gallery",
    metaDesc: "Website Gallery: a collection of websites you can try for yourself, along with where they started — each case comes with its build prompt to read, copy, and compare against the finished site.",
    toggle: "中",
    count: n => n + (n === "01" ? " exhibition" : " exhibitions"),
    heroTitle: "Website Gallery",
    heroText: "A collection of websites you can explore for yourself — and the starting points that made them. Cases marked with a prompt let you read and copy it right here, then open the finished site to compare.",
    colNum: "No.", colEx: "Exhibition", colLink: "Links",
    open: t => "Open " + t,
    badge: "Case study · Build prompt included",
    defaultNote: "The original brief that kicked off the build; the finished site went through further implementation, debugging and in-browser testing.",
    copy: "Copy prompt", copyAria: t => "Copy the prompt for " + t,
    copied: "Copied ✓", copiedStatus: "Full prompt copied",
    selectFallback: "Full text selected — press Ctrl+C / ⌘C to copy",
    source: "Source ↗",
    tagLocal: "Local", tagIntl: "Global", tagChina: "China", openWork: "Open work", pending: "Coming soon",
    transNote: "English translation (for reference)",
    showOriginal: "Show original", showTranslation: "Show English translation",
    origNote: "Original prompt (Chinese, verbatim)",
    labels: { "打开网站": "Open site" },
  },
};
const safeGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
function initialLang() {
  try { const q = new URLSearchParams(location.search).get("lang"); if (q === "zh" || q === "en") return q; } catch {}
  const s = safeGet(LANG_KEY); if (s === "zh" || s === "en") return s;
  return /^zh/i.test(navigator.language || "") ? "zh" : "en";
}
let lang = initialLang();
const pick = (ex, key) => (lang === "en" && ex[key + "En"]) || ex[key];
// 英文状态下中文 prompt 默认显示译文；可按条切回原文
const showOriginal = new Set();
const closedPrompts = new Set();

const localPreview = ["127.0.0.1", "localhost"].includes(location.hostname);
const resolveEntry = url => localPreview && url?.startsWith("https://sunxiaoxi2039-star.github.io/website-showcase-sites/")
  ? url.replace("https://sunxiaoxi2039-star.github.io/website-showcase-sites/", "../website-showcase-sites/") : url;
const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

function renderList() {
  const T = I18N[lang];
  list.textContent = "";
  EXHIBITIONS.forEach((entry, i) => {
    const ex = {...entry, intl: resolveEntry(entry.intl), cover: resolveEntry(entry.cover)};
    const title = pick(ex, "title");
    const hasTrans = lang === "en" && !!ex.promptEn;
    const useTrans = hasTrans && !showOriginal.has(i);
    const promptShown = useTrans ? ex.promptEn : ex.prompt;
    const label = ex.label ? (T.labels[ex.label] || ex.label) : "";
    const isLocal = localPreview && ex.intl && ex.intl.startsWith("../");
    const article = document.createElement("article");
    article.className = "exhibit";
    article.innerHTML = `
    <span class="num">${String(i + 1).padStart(2, "0")}</span>
    <div class="ex-body">
      <a class="cover" href="${ex.intl}" target="_blank" rel="noreferrer" aria-label="${escapeHtml(T.open(title))}">${ex.cover ? `<img src="${ex.cover}" alt="${escapeHtml(title)}" onerror="this.remove()">` : ""}</a>
      <div>
        ${ex.prompt ? `<span class="case-badge">${T.badge}</span>` : ''}
        <h2 class="ex-title serif"><a href="${ex.intl}" target="_blank" rel="noreferrer">${escapeHtml(title)}</a></h2>
        <div class="ex-sub">${escapeHtml(pick(ex, "sub"))}</div>
        <p class="ex-desc">${escapeHtml(pick(ex, "desc"))}</p>
        ${ex.prompt ? `<details class="prompt-box"${closedPrompts.has(i) ? '' : ' open'}>
          <summary>Prompt · ${escapeHtml(pick(ex, "promptLabel"))}</summary>
          <div class="prompt-content">
            ${hasTrans ? `<div class="prompt-lang"><span class="prompt-lang-note">${useTrans ? T.transNote : T.origNote}</span><button class="prompt-switch" type="button" aria-pressed="${!useTrans}">${useTrans ? T.showOriginal : T.showTranslation}</button></div>` : ''}
            <pre class="prompt-text"${hasTrans && !useTrans ? ' lang="zh-CN"' : ''}>${escapeHtml(promptShown)}</pre>
            <p class="prompt-note">${escapeHtml(pick(ex, "promptNote") || T.defaultNote)}</p>
            <div class="prompt-actions"><button class="copy-prompt" type="button" aria-label="${escapeHtml(T.copyAria(title))}">${T.copy}</button>${ex.promptSource ? `<a class="prompt-source" href="${ex.promptSource}" target="_blank" rel="noreferrer">${T.source}</a>` : ''}<span class="copy-status" role="status" aria-live="polite"></span></div>
          </div>
        </details>` : ''}
      </div>
    </div>
    <div class="links">
      ${ex.intl ? `<a class="gate" href="${ex.intl}" target="_blank" rel="noreferrer"><span class="tag">${ex.label ? (ex.platform || "SITES") : (isLocal ? T.tagLocal : T.tagIntl)}</span>${label || (isLocal ? T.openWork : "GitHub Pages")} ↗</a>` : ""}
      ${ex.china ? `<a class="gate" href="${ex.china}" target="_blank" rel="noreferrer"><span class="tag">${T.tagChina}</span>Kimi ↗</a>` : (ex.platform === "KIMI" ? "" : `<span class="gate off"><span class="tag">${T.tagChina}</span>${T.pending}</span>`)}
    </div>`;
    const details = article.querySelector('.prompt-box');
    if (details) details.addEventListener('toggle', () => { details.open ? closedPrompts.delete(i) : closedPrompts.add(i); });
    const switchButton = article.querySelector('.prompt-switch');
    if (switchButton) switchButton.addEventListener('click', () => {
      showOriginal.has(i) ? showOriginal.delete(i) : showOriginal.add(i);
      const y = article.getBoundingClientRect().top;
      renderList();
      const next = list.children[i];
      if (next) { window.scrollBy(0, next.getBoundingClientRect().top - y); next.querySelector('.prompt-switch')?.focus({ preventScroll: true }); }
    });
    const copyButton = article.querySelector('.copy-prompt');
    if (copyButton) copyButton.addEventListener('click', async () => {
      const status = article.querySelector('.copy-status');
      try {
        await navigator.clipboard.writeText(promptShown);
        status.textContent = T.copiedStatus;
        copyButton.textContent = T.copied;
        setTimeout(() => { copyButton.textContent = T.copy; status.textContent = ''; }, 2500);
      } catch {
        const range = document.createRange();
        range.selectNodeContents(article.querySelector('.prompt-text'));
        const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
        status.textContent = T.selectFallback;
      }
    });
    list.appendChild(article);
  });
}

function applyLang(next, persist) {
  lang = next;
  const T = I18N[lang];
  if (persist) safeSet(LANG_KEY, lang);
  document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
  document.title = T.title;
  document.querySelector('meta[name="description"]')?.setAttribute("content", T.metaDesc);
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[el.dataset.i18n]; });
  document.getElementById("count").textContent = T.count(String(EXHIBITIONS.length).padStart(2, "0"));
  const btn = document.getElementById("lang-toggle");
  btn.textContent = T.toggle;
  btn.setAttribute("lang", lang === "en" ? "zh-CN" : "en");
  renderList();
}
document.getElementById("lang-toggle").addEventListener("click", () => applyLang(lang === "en" ? "zh" : "en", true));
applyLang(lang, false);

</script>
</body>
</html>
