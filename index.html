
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Website Gallery — 网站画廊</title>
<style>
  :root { --ink: #000; --paper: #fff; --mute: rgba(0,0,0,.45); --line: rgba(0,0,0,.14); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--paper); color: var(--ink); }
  body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
  .serif { font-family: 'Times New Roman', 'Songti SC', 'SimSun', serif; }

  .masthead { padding: 32px; display: flex; justify-content: space-between; align-items: baseline; }
  .brand { font-size: 18px; letter-spacing: .05em; }
  .count { font-size: 12px; color: var(--mute); letter-spacing: .12em; text-transform: uppercase; }

  .hero { padding: 14vh 32px 10vh; max-width: 1200px; }
  .hero h1 { font-size: clamp(40px, 7vw, 96px); font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; }
  .hero p { margin-top: 28px; font-size: 15px; line-height: 1.9; color: var(--mute); max-width: 520px; }

  .index-head { padding: 0 32px 20px; display: grid; grid-template-columns: 64px 1fr 220px; gap: 24px;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute);
    border-bottom: 1px solid var(--line); }
  @media (max-width: 720px) { .index-head { grid-template-columns: 40px 1fr; } .index-head .col-link { display: none; } }

  .exhibit { display: grid; grid-template-columns: 64px 1fr 220px; gap: 24px; padding: 40px 32px;
    border-bottom: 1px solid var(--line); align-items: start; text-decoration: none; color: inherit; }
  @media (max-width: 720px) { .exhibit { grid-template-columns: 40px 1fr; } }

  .num { font-size: 13px; color: var(--mute); padding-top: 6px; font-variant-numeric: tabular-nums; }

  .ex-body { display: grid; grid-template-columns: 168px 1fr; gap: 32px; align-items: start; }
  @media (max-width: 720px) { .ex-body { grid-template-columns: 1fr; } }

  .cover { width: 168px; height: 210px; overflow: hidden; position: relative;
    background: linear-gradient(135deg,#0b0b12 0%,#1d1033 28%,#0f3b4d 52%,#3d1030 76%,#0b0b12 100%); }
  .cover::after { content:""; position:absolute; inset:0;
    background: radial-gradient(120% 90% at 30% 20%, rgba(0,255,255,.35), transparent 55%),
                radial-gradient(100% 80% at 75% 80%, rgba(255,0,200,.3), transparent 55%); }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
    transition: transform .6s cubic-bezier(.2,.6,.2,1); }
  .exhibit:hover .cover img { transform: scale(1.05); }

  .ex-title { font-size: clamp(26px, 3vw, 40px); font-weight: 400; line-height: 1.15; letter-spacing: -0.01em; }
  .ex-sub { margin-top: 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .ex-desc { margin-top: 18px; font-size: 14px; line-height: 1.85; color: rgba(0,0,0,.72); max-width: 560px; }

  .links { display: flex; flex-direction: column; gap: 10px; }
  @media (max-width: 720px) { .links { grid-column: 2; flex-direction: row; flex-wrap: wrap; } }
  .gate { display: inline-block; font-size: 13px; letter-spacing: .04em; text-decoration: none; color: var(--ink);
    border: 1px solid var(--line); padding: 11px 18px; transition: background .2s, border-color .2s; }
  .gate:hover { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.4); }
  .gate .tag { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin-right: 8px; }
  .gate.off { color: var(--mute); pointer-events: none; border-style: dashed; }

  footer { padding: 64px 32px 40px; font-size: 12px; color: var(--mute); letter-spacing: .02em;
    display: flex; justify-content: space-between; }

  .ex-body > div { min-width: 0; }
  .ex-title a { color: inherit; text-decoration: none; }
  .ex-title a:hover { text-decoration: underline; text-underline-offset: 5px; }
  .case-badge { display: inline-block; margin-bottom: 13px; padding: 5px 8px; border: 1px solid #bdc8bd; color: #435d43; font-size: 10px; letter-spacing: .07em; }
  .prompt-box { margin-top: 24px; max-width: 660px; border: 1px solid var(--line); background: #f7f7f4; }
  .prompt-box summary { padding: 14px 16px; font-size: 12px; cursor: pointer; letter-spacing: .03em; }
  .prompt-content { padding: 0 16px 16px; }
  .prompt-text { max-height: 360px; overflow-y: auto; padding-right: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.9 system-ui, sans-serif; color: #303330; user-select: text; }
  .prompt-note { margin-top: 12px; font-size: 11px; line-height: 1.7; color: var(--mute); }
  .prompt-actions { margin-top: 14px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  .copy-prompt { padding: 8px 13px; font: 12px system-ui,sans-serif; border: 1px solid #b9bdb4; background: #fff; cursor: pointer; }
  .copy-prompt:hover { background: #eaede5; }
  .prompt-source { color: #435d43; font-size: 12px; text-underline-offset: 3px; }
  .copy-status { font-size: 11px; color: #435d43; }
  :focus-visible { outline: 2px solid #435d43; outline-offset: 4px; }
  @media (max-width: 720px) { .exhibit { padding: 28px 20px; gap: 12px; } .cover { width: 100%; height: 180px; } .prompt-content { padding: 0 12px 12px; } .prompt-box summary { padding: 12px; } }
</style>
</head>
<body>

<footer>

<script>

    desc:  "一套没有天花板的温暖自然住宅：自由旋转探索客厅、厨房、餐厅、卧室、卫生间与阳台，点选 32 组家具阅读设计细节。支持真实材质、白模与线框，昼夜灯光、家具显隐、房间漫游及一键平面图。",
    cover: "https://sunxiaoxi2039-star.github.io/website-showcase-sites/ideas/habitat/cover.png",

  },

    desc: "六轮探测车在三维月面缓慢行驶，留下连续车辙。自由观察车轮、悬挂与仪器，探索陨石坑、岩石和星空；支持环绕、车载及自由漫游视角。",

  },
  {
    title: "四季小屋",
    sub: "Moonlit Forge — One Cottage, Six Moments",
    promptLabel: "从零制作 · 逆向整理版",
    prompt: "请从零制作一个名为「MOONLIT FORGE」的可交互 3D 微缩小屋网页。它应像一本可以触摸的童话绘本：同一座温暖的小屋，在夜晚、白天与四季之间流转。请直接交付能运行的完整网站、三维模型和可编辑源码。\n\n一、整体视觉\n采用精致的低多边形微缩模型风格，几何轮廓清楚，边缘轻微倒角，材质哑光，灯光柔和。画面安静、有大量留白；避免写实摄影、复杂后台面板和满屏装饰。模型必须为可以从不同角度观察的真实三维几何。\n\n二、小屋建模\n在 Blender 中建模并导出 GLB，同时保存 .blend；使用 Three.js 加载与渲染。以一块约 5.7×5.4 单位的厚实方形草地底座承托场景，底座有深绿色侧壁、倒角和柔和投影。\n中央是一座童话风石砌小屋：灰紫墙体、陡峭且檐角微翘的双坡屋顶、错缝排列的紫红色实体瓦片、浅灰石质屋脊和檐边。墙角露出交错石块，墙面有少量修补石。正面是琥珀色拱形木门，带纵向木板、黑色铰链、门把手和浅色拱门框；门上方有发出暖光的窄拱窗。\n左侧连接小型锻炉及高烟囱，炉口是拱形，内部可见橙暖火光；烟囱分段砌砖，顶部有缓缓漂浮的低多边形烟团。右侧是一片延伸屋檐，由细木柱支撑；屋檐下放木墩和深色铁砧，旁边堆放切口可见的木柴。门口有暖光壁灯、石阶和不规则踏步石。周围点缀岩石、小花、草丛和一棵圆润块状树冠的小树。\n把树叶、草地、发光窗、炉火、烟团和积雪分别组织成可识别的对象或材质，方便实时控制。允许合并同材质的静态细节，但保留季节变化所需部件。\n\n三、六个场景\n用底部六个标签切换 Night、Day、Spring、Summer、Autumn、Winter；默认 Night。同一模型在切换时保持当前观察角度，不重新加载。\nNight：深蓝灰背景 #191b27，奶油色正文、浅黄绿强调色，冷色环境光映衬橙色炉火、门灯与窗光。\nDay：浅灰鼠尾草绿背景 #c4caba，深绿色文字，柔和日光照亮草地与墙体，减弱炉火与窗光。\nSpring：薄荷绿背景 #a1c5b0，树冠偏粉，草地鲜绿，少量浅粉花瓣缓慢飘落。\nSummer：深青绿背景 #216060，奶油色文字，树叶浓绿、日光温暖；桌面布局将模型移到左侧，文案移到右侧。\nAutumn：灰玫瑰背景 #6c5358，暖米色文字，树叶金褐色，草地泛黄，少量金色落叶飘落，增强炉火暖意。\nWinter：蓝灰背景 #42596d，浅灰白文字，屋顶及地面可见真正的积雪几何，雪花缓缓落下，窗与炉火更暖。\n背景、文字颜色、材质颜色和灯光在约 0.8–1.3 秒内柔和过渡。烟团轻微浮动，炉火亮度小幅呼吸；特效克制，不遮挡建筑，也不让炉口成为过曝白斑。\n\n四、页面布局与文案\n桌面为铺满视口的单页，顶部左侧两行小字标志「MOONLIT / FORGE」，中间小字「ONE COTTAGE. SIX MOMENTS.」及当前章节，右侧 Pause / Play 按钮。\n主区域一般左文右图，文案约占 42%，模型约占 58%；模型视角为略俯视的三分之四视角，完整显示底座、房顶和烟囱。标题使用大号优雅衬线体，第二行斜体并使用场景强调色；小字用简洁无衬线体。\n六场景标题依次为：\nNight：Moon above. / Fire within.\nDay：Morning light. / A slower start.\nSpring：Soft petals. / Fresh starts.\nSummer：Long days. / Slow living.\nAutumn：Golden leaves. / Warmer hearts.\nWinter：Quiet snow. / Warm windows.\n每个标题下写两句简短英文氛围文案与一个进入下一场景的文字箭头按钮。右侧边缘放六个细长进度标记；底部中间是带小图标的胶囊形六场景切换器，左下「A LIVING MINIATURE」，右下「EST. 2026」。模型下方提示「DRAG TO EXPLORE」并提供重置视角按钮。\n\n五、交互\n鼠标或触摸拖动旋转小屋，带轻微阻尼并限制上下翻转。静置时缓慢自动旋转。点击场景标签、右侧进度标记、下一场景按钮，或滚动鼠标滚轮，都能切换场景；滚轮需节流，避免一次滚动跳过多章。\nPause 冻结自动旋转、烟雾、飘落粒子及炉火波动，但用户仍可拖动和切换场景；Play 恢复动画。Reset 恢复初始三分之四视角。快速连续切换时只显示当前文案，不能叠字、跳高或错位。\n\n六、移动端与工程\n手机改为上文下图，模型保持足够大，六个标签完整可点，底部控件不覆盖主要内容；390×844 视口没有横向溢出。所有按钮支持键盘焦点、可读标签；尊重减少动态效果设置。\n模型、纹理和代码使用可部署的相对资源路径，提供加载状态、加载失败提示与 WebGL 不支持提示。优先合并几何和复用材质，限制像素比与粒子数量。使用物理材质、柔和阴影、环境补光和适当色调映射呈现微缩模型质感。\n\n七、交付与验收\n交付可运行网站、GLB、Blender 源文件和启动说明。实际检查六场景、拖动旋转、暂停/继续、重置、滚动切换、快速连点与手机布局；确认模型及资源加载成功、控制台无运行错误。不要以一张渲染图、静态模型截图或空页面代替交互成品。",

    desc: "可旋转的三维微缩小屋，在夜晚、白天、春、夏、秋、冬六种状态间切换。观察炉火、窗光、花叶和积雪，暂停动画或拖动探索细节。",

const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
EXHIBITIONS.forEach((entry, i) => {
  const ex = {...entry, intl: resolveEntry(entry.intl), cover: resolveEntry(entry.cover)};
  const article = document.createElement("article");
  article.className = "exhibit";
  article.innerHTML = `
    <span class="num">${String(i + 1).padStart(2, "0")}</span>
    <div class="ex-body">
      <a class="cover" href="${ex.intl}" target="_blank" rel="noreferrer" aria-label="打开${ex.title}">${ex.cover ? `<img src="${ex.cover}" alt="${ex.title}" onerror="this.remove()">` : ""}</a>
      <div>
        ${ex.prompt ? '<span class="case-badge">成功案例 · 附制作 Prompt</span>' : ''}
        <h2 class="ex-title serif"><a href="${ex.intl}" target="_blank" rel="noreferrer">${ex.title}</a></h2>
        <div class="ex-sub">${ex.sub}</div>
        <p class="ex-desc">${ex.desc}</p>
        ${ex.prompt ? `<details class="prompt-box" open>
          <summary>Prompt · ${ex.promptLabel}</summary>
          <div class="prompt-content">
            <pre class="prompt-text">${escapeHtml(ex.prompt)}</pre>
            <p class="prompt-note">${ex.promptNote || '保留发起制作时的原始需求；成品经过后续实现、调试与浏览器验证。'}</p>
            <div class="prompt-actions"><button class="copy-prompt" type="button" aria-label="复制${ex.title}的 Prompt">复制 Prompt</button>${ex.promptSource ? `<a class="prompt-source" href="${ex.promptSource}" target="_blank" rel="noreferrer">参考来源 ↗</a>` : ''}<span class="copy-status" role="status" aria-live="polite"></span></div>
          </div>
        </details>` : ''}
      </div>
    </div>
    <div class="links">
      ${ex.intl ? `<a class="gate" href="${ex.intl}" target="_blank" rel="noreferrer"><span class="tag">${ex.label ? (ex.platform || "SITES") : (localPreview && ex.intl.startsWith("../") ? "本地" : "国际")}</span>${ex.label || (localPreview && ex.intl.startsWith("../") ? "打开作品" : "GitHub Pages")} ↗</a>` : ""}
      ${ex.china ? `<a class="gate" href="${ex.china}" target="_blank" rel="noreferrer"><span class="tag">中国</span>Kimi ↗</a>` : (ex.platform === "KIMI" ? "" : `<span class="gate off"><span class="tag">中国</span>待发布</span>`)}
    </div>`;
  const copyButton = article.querySelector('.copy-prompt');
  if (copyButton) copyButton.addEventListener('click', async () => {
    const status = article.querySelector('.copy-status');
    try {
      await navigator.clipboard.writeText(ex.prompt);
      status.textContent = '已复制完整 Prompt';
      copyButton.textContent = '已复制 ✓';
      setTimeout(() => { copyButton.textContent = '复制 Prompt'; status.textContent = ''; }, 2500);
    } catch {
      const range = document.createRange();
      range.selectNodeContents(article.querySelector('.prompt-text'));
      const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
      status.textContent = '已选中全文，请按 Ctrl+C / ⌘C 复制';
    }
  });
  list.appendChild(article);
});

</script>
</body>
</html>
